<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120f0b">
<link rel="icon" href="data:,">
<title>Раскопки</title>
<style>
  /* Full screen on phones; a centred portrait window (9:16) on wider screens. */
  html, body { margin: 0; height: 100%; background: #120f0b; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #unity-canvas { display: block; background: #120f0b; touch-action: none; outline: none;
    width: min(100vw, calc(100dvh * 9 / 16)); height: min(100dvh, calc(100vw * 16 / 9)); }
  @media (max-aspect-ratio: 10/16) { #unity-canvas { width: 100vw; height: 100dvh; } }
  #load { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center;
    font: 700 14px/1.4 system-ui, -apple-system, sans-serif; color: #d9c7a3; background: #120f0b; }
  #load b { font-size: 28px; letter-spacing: .12em; color: #f2dfb6; }
  #bar { width: 220px; height: 10px; border: 2px solid #5a4a33; background: #1d1810; }
  #fill { display: block; height: 100%; width: 0; background: #c9a35a; transition: width .2s; }
  #err { color: #ff8a7a; max-width: 300px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="load"><b>РАСКОПКИ</b><div id="bar"><i id="fill"></i></div><span id="msg">Загрузка…</span></div>
<script>
  const s = document.createElement("script");
  s.src = "Build/WebGL.loader.js";
  s.onload = () => {
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "White Sharx",
      productName: "dig-prototype",
      productVersion: "0.1.0",
    }, p => { document.getElementById("fill").style.width = Math.round(p * 100) + "%"; })
      .then(() => document.getElementById("load").remove())
      .catch(e => { const m = document.getElementById("msg"); m.id = "err"; m.textContent = "Не удалось запустить: " + e; });
  };
  document.body.appendChild(s);
</script>
</body>
</html>
