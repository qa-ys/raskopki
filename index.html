<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Раскопки — MVP V4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script>try{ if(window.top !== window.self) document.documentElement.className = "embed"; }catch(e){ document.documentElement.className = "embed"; }</script>
<style>
:root{
  --bg:#0d0b09; --panel:#16110c; --line:#6d5a3c; --line-dim:#3d3324;
  --ink:#d8c9ab; --ink-hi:#e8d6ae; --ink-dim:#9c8763; --ink-off:#6f5d42;
  --hud:#9fe08a; --gold:#c9a14a; --warn:#c4622e;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;overflow:hidden}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'VT323',ui-monospace,'Courier New',monospace;
  -webkit-font-smoothing:none; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  display:flex; align-items:stretch; justify-content:center;
  height:100vh; height:100dvh;
}
@supports (height:100dvh){ body{height:100dvh} }
#app{width:100%;max-width:420px;height:100%;max-height:100%;overflow:hidden;display:flex;flex-direction:column;gap:8px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px));position:relative}
.row{display:flex;align-items:center;gap:8px}
.btn{font:inherit;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line)}
.btn:active{background:#221a12}
.btn[disabled]{cursor:default;color:var(--ink-off);border-color:var(--line-dim)}
.btn.can{border-color:var(--hud);color:var(--hud)}
.small{font-size:19px;line-height:1.15;color:var(--ink-dim)}
.chip{border:1px solid var(--line);background:var(--panel);padding:8px 10px;line-height:1}

#top{display:flex;align-items:center;gap:8px}
#coinBox{flex-grow:1;display:flex;align-items:center;gap:8px}
#coins{font-size:23px;line-height:1;color:var(--ink-hi)}
#rate{margin-left:auto;font-size:18px;line-height:1;color:var(--ink-dim)}
#sound{width:42px;height:37px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

#meta{display:flex;align-items:baseline;justify-content:space-between}
#goal{display:none;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:18px;line-height:1;color:var(--ink-dim)}
#goal.on{display:flex}
#goalT{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#goalR{color:var(--gold);flex:0 0 auto}
#ev{display:none;position:absolute;left:14px;right:14px;z-index:45;
  bottom:calc(122px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--hud);background:var(--panel);color:var(--hud);
  padding:9px 12px;font-size:20px;letter-spacing:1px;cursor:default}
#ev.on{display:block}
#ev.cat{cursor:pointer;animation:blip 1.1s infinite}
#evRow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
#evT{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#evX{flex:0 0 auto}
#evBar{height:5px;border:1px solid var(--line-dim);margin-top:6px}
#evBar > i{display:block;height:100%;background:var(--hud);width:100%}
#crewBtn{display:none;width:42px;height:37px;align-items:center;justify-content:center}
#crewBtn.on{display:flex}
#crewBtn.alert{border-color:var(--hud);color:var(--hud)}
#crewPanel{display:none;position:absolute;z-index:30;right:14px;
  top:calc(58px + env(safe-area-inset-top,0px));width:min(300px,calc(100% - 28px));
  border:1px solid var(--line);background:var(--panel);padding:10px;
  flex-direction:column;gap:9px}
#crewPanel.on{display:flex}
.crow{display:flex;flex-direction:column;gap:4px;font-size:18px;line-height:1.1;color:var(--ink-dim)}
.crow.hit{color:var(--hud)}
.crow .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cwbar{height:6px;border:1px solid var(--line-dim);background:var(--bg);overflow:hidden}
.cwbar > i{display:block;height:100%;background:var(--ink-dim);width:0}
.crow.hit .cwbar > i{background:var(--hud)}
#crewPanel .btn{height:40px;font-size:17px;letter-spacing:1px}

.screen{flex:1 1 auto;min-height:0;display:none;flex-direction:column;gap:8px}
.screen.on{display:flex}

.pit{position:relative;flex:1 1 auto;min-height:150px;border:1px solid var(--line);
  background:#1d1610;touch-action:none;overflow:hidden;cursor:crosshair}
.pit canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none}
.fx.dither{background-image:
  linear-gradient(45deg,rgba(0,0,0,.30) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.30) 75%),
  linear-gradient(45deg,rgba(0,0,0,.30) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.30) 75%);
  background-size:4px 4px;background-position:0 0,2px 2px}
.fx.scan{background-image:repeating-linear-gradient(to bottom,rgba(0,0,0,.30) 0 1px,rgba(0,0,0,0) 1px 3px)}
.fx.vig{box-shadow:inset 0 0 80px 26px rgba(13,11,9,.92)}
.tag{position:absolute;left:8px;top:8px;padding:4px 8px;font-size:18px;line-height:1.1;
  color:var(--ink-dim);background:rgba(13,11,9,.78);border:1px solid var(--line-dim);pointer-events:none}
.tag.warn{color:var(--warn);top:auto;bottom:8px}

.meter{height:12px;border:1px solid var(--line);background:var(--panel);overflow:hidden}
.meter > i{display:block;height:100%;background:var(--hud);width:0}
.cta{width:100%;height:52px;font-size:26px;letter-spacing:2px;line-height:1}
.half{flex-grow:1;height:52px;font-size:23px;letter-spacing:2px;line-height:1}

#slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
/* Витрина — два ряда по три, карточка низкая: освободившаяся высота уходит
   очереди покупателей, которая без таймера висит целиком. Метка ручной чистки
   стала точкой в углу — строку она больше не занимает. */
.slot{position:relative;border:1px solid var(--line-dim);background:var(--panel);padding:5px 4px;
  min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;text-align:center}
.slot.full{border-color:var(--line)}
.slot .sn{font-size:15px;line-height:1;color:var(--ink-hi)}
.slot .sq{font-size:15px;line-height:1}
.slot .empty{font-size:14px;line-height:1.05;color:var(--ink-dim)}
.slot .dot{position:absolute;top:3px;right:5px;font-size:14px;line-height:1;color:var(--hud)}
.sh{font-size:14px;line-height:1;color:var(--ink-off);letter-spacing:1px}
.sh.by{color:var(--hud)}

#storeWrap{display:flex;flex-direction:column;gap:5px}
#store{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.si{flex:0 0 auto;width:74px;border:1px solid var(--line-dim);background:var(--panel);
  padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.si.can{border-color:var(--hud)}
.si .sn{font-size:14px;line-height:1.05;color:var(--ink-hi)}
.si .sq{font-size:14px;line-height:1}
.si.empty{justify-content:center;color:var(--ink-dim);font-size:14px;cursor:default}

#deals{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.offer{border:1px solid var(--line);background:var(--panel);padding:10px;
  display:flex;flex-direction:column;gap:8px}
.offer.none{border-color:var(--line-dim)}
.oh{display:flex;align-items:center;gap:8px;cursor:pointer}
.oh .on{flex:1 1 auto;min-width:0;font-size:17px;letter-spacing:1px;color:var(--hud)}
.oh .oc{font-size:19px;color:var(--gold)}
.oh .ot{width:22px;text-align:center;font-size:22px;line-height:1;color:var(--ink-dim);
  border:1px solid var(--line-dim)}
.ob{display:flex;flex-direction:column;gap:8px}
.offer.min .ob{display:none}
.of{width:50px;flex:0 0 auto}
.ol{font-size:20px;line-height:1.2;color:var(--ink-hi)}
.orow{border-top:1px solid var(--line-dim);padding-top:8px;display:flex;align-items:baseline;justify-content:space-between}
.ofor{font-size:19px;color:var(--ink-dim)}
.osum{font-size:28px;line-height:1;color:var(--gold)}
.onote{font-size:16px;line-height:1.25;color:var(--ink-dim)}
.offer .half{height:46px;font-size:20px}

#mapTabs{display:flex;gap:4px;margin-bottom:8px}
.mtab{position:relative;flex:1 1 auto;min-width:fit-content;height:38px;padding:0 8px;
  border:1px solid var(--line-dim);background:var(--panel);color:var(--ink-off);font:inherit;
  font-size:17px;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.mtab.on{border-color:var(--hud);color:var(--hud);background:#191b14}
.mtab.new{padding-right:15px}
.mtab.new::after{content:"•";position:absolute;top:1px;right:4px;font-size:16px;line-height:1;color:var(--gold)}
.rep{border:1px solid var(--line-dim);background:var(--panel);padding:9px;
  display:flex;flex-direction:column;gap:6px}
.rep .rh{display:flex;justify-content:space-between;font-size:19px;color:var(--ink-hi)}
.rep .rh b{font-weight:normal;color:var(--hud)}
.pips{display:flex;gap:3px;margin-top:4px}
.pip{width:15px;height:8px;border:1px solid var(--line-dim)}
.pip.on{background:var(--hud);border-color:var(--hud)}
#mapList{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.loc{border:1px solid var(--line-dim);background:var(--panel);padding:10px;display:flex;gap:10px;align-items:center}
.loc.here{border-color:var(--hud)}
.loc.ready{border-color:var(--gold)}
.loc .g{flex-grow:1;min-width:0}
.loc .ln{font-size:21px;line-height:1.1;color:var(--ink-hi)}
.loc .ls{font-size:17px;line-height:1.2;color:var(--ink-dim)}
.loc button{width:104px;min-height:46px;font-size:18px;padding:4px 6px;line-height:1.1}
.bar{height:7px;border:1px solid var(--line-dim);margin-top:5px}
.bar > i{display:block;height:100%;background:var(--gold);width:0}
.hire{display:flex;gap:8px;margin-top:8px}
.hire button{flex-grow:1;height:46px;font-size:18px;line-height:1.1}
#mapFoot{flex:0 0 auto;padding-top:8px}
#reset{width:100%;height:44px;margin-top:4px;font-size:17px;letter-spacing:1px;
  color:var(--ink-dim);border-color:var(--line-dim)}
#reset.arm{color:var(--warn);border-color:var(--warn)}

#nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#nav .btn{height:44px;font-size:17px;letter-spacing:1px}
#nav .btn.on{border-color:var(--hud);color:var(--hud)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.6}}
#nav .btn.alert{border-color:var(--hud);color:var(--hud);animation:blip 1s infinite}

#coach{position:absolute;inset:0;z-index:40;display:none;pointer-events:none}
#coach.on{display:block}
#cmask{position:absolute;inset:0;background:rgba(6,5,4,.80);pointer-events:auto;display:none}
#coach.hard #cmask{display:block}
.cup{position:relative;z-index:41}
#cring{position:absolute;z-index:42;display:none;border:2px solid var(--hud);pointer-events:none;animation:pulse 1.25s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#chand{position:absolute;z-index:42;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--hud);
  border-radius:50%;background:rgba(159,224,138,.18);pointer-events:none;display:none;
  animation:swipe 2s ease-in-out infinite}
@keyframes swipe{0%{transform:translate(0,0);opacity:0}12%{opacity:1}
  50%{transform:translate(120px,44px);opacity:1}88%{opacity:.4}100%{transform:translate(0,0);opacity:0}}
#cbub{position:absolute;z-index:43;left:10px;right:10px;border:1px solid var(--hud);background:#12100c;
  padding:12px;display:none;gap:10px;align-items:flex-start;pointer-events:auto}
#cbub.on{display:flex}
#cname{font-size:17px;line-height:1;letter-spacing:1px;color:var(--hud);margin-bottom:5px}
#ctxt{font-size:20px;line-height:1.2;color:var(--ink-hi)}
#chint{font-size:17px;line-height:1.2;color:var(--ink-dim);margin-top:5px}

#holePick{display:none;flex:1 1 auto;min-height:0;overflow:auto;flex-direction:column;gap:7px}
#scDig.pick #holePick{display:flex}
#scDig.pick #digPit, #scDig.pick .digWork, #scDig.pick #digCta{display:none}
.hcard{border:1px solid var(--line-dim);background:var(--panel);padding:8px;
  display:flex;flex-direction:column;gap:6px}
.hcard.ad{border-color:var(--gold)}
.hcard.lock{opacity:.6}
.hrow{display:flex;gap:8px;align-items:stretch}
.hstrip{width:26px;flex:0 0 auto;display:flex;flex-direction:column;border:1px solid var(--line-dim)}
.hstrip > i{flex:1;display:block}
.hinfo{min-width:0;flex-grow:1}
.hn{font-size:21px;line-height:1;color:var(--ink-hi);letter-spacing:1px;
  display:flex;justify-content:space-between;gap:8px}
.hn > i{font-style:normal;font-size:16px;color:var(--ink-off)}
.hn > i.gold{color:var(--gold)}
.hs{font-size:16px;line-height:1.15;color:var(--ink-dim);margin-top:2px}
.hl{font-size:16px;line-height:1;color:var(--ink-off);margin-top:4px}
.hodds{font-size:16px;line-height:1;margin-top:4px;color:var(--ink-off)}
.hodds b{font-weight:normal;color:var(--ink-hi)}
.hodds b.gold{color:var(--gold)}
.hreq{font-size:16px;line-height:1;margin-top:4px;color:var(--hud)}
.hreq.no{color:var(--warn)}
.hsw{font-size:17px;line-height:1;letter-spacing:1px;padding:6px 10px;margin:0 8px 0 auto;
  flex:0 0 auto;white-space:nowrap}
.hbtns{display:flex;gap:6px}
.hbtns .btn{flex:1;height:38px;font-size:18px;letter-spacing:1px}
#digSkid{display:none;left:8px;right:8px;top:auto;bottom:8px;color:var(--warn);
  border-color:var(--warn);text-align:center}
#digSkid.on{display:block}
#crateRow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cr.set{border-color:var(--hud)}
.cr.set .crn{color:var(--hud)}
.cr{flex:0 0 auto;width:66px;border:1px solid var(--line-dim);background:var(--panel);padding:4px 3px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink-dim);
  cursor:pointer;text-align:center}
.cr.on{border-color:var(--hud);color:var(--hud)}
.cr .crn{font-size:12px;line-height:1.05}
.cbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#crewPanel .cbtn{height:34px;font-size:13px;letter-spacing:0;padding:0}
#crewPanel .cbtn.on{border-color:var(--hud);color:var(--hud)}
#crewPanel .cpause{width:100%;height:34px;font-size:14px;letter-spacing:0}
#crewPanel .cpause.off{color:var(--warn);border-color:var(--warn)}
#clnWarn{display:none}
#clnWarn.on{display:block}
#clnHold, #digHold{display:none;left:auto;right:8px;color:var(--hud);border-color:var(--hud)}
#digHold{top:auto;bottom:8px}
#clnHold.on, #digHold.on{display:block}
#nav.five{grid-template-columns:repeat(5,minmax(0,1fr))}
#nav.five .btn{font-size:14px;letter-spacing:0}
#navAlbum{display:none}
#nav.five #navAlbum{display:block}

.alNote{grid-column:1/-1;font-size:15px;line-height:1.25;color:var(--ink-dim);
  border:1px solid var(--line-dim);padding:7px 8px}
#albumGrid{flex:1 1 auto;min-height:0;overflow:auto;display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.alHead{grid-column:1/-1;font-size:17px;letter-spacing:1px;color:var(--ink-dim);
  border-bottom:1px solid var(--line-dim);padding-bottom:4px;margin-top:2px}
.alHead b{font-weight:normal;color:var(--hud)}
.ac{border:1px solid var(--line-dim);background:var(--panel);padding:8px;
  display:flex;gap:8px;align-items:center;min-height:60px}
.ac.have{border-color:var(--hud)}
.ac .an{font-size:16px;line-height:1.1;color:var(--ink-hi)}
.ac .as{font-size:14px;line-height:1.2;color:var(--ink-dim);margin-top:3px}
.ac.miss .an{color:var(--ink-dim)}
.ac.miss svg{opacity:.25}

.siw{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
.siw .si{width:74px}
#away{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(8,6,4,.86);padding:20px}
#away.on{display:flex}
.awBox{width:100%;max-width:320px;border:1px solid var(--line);background:var(--panel);
  padding:12px;display:flex;flex-direction:column;gap:10px}
.awH{font-size:23px;letter-spacing:2px;color:var(--hud)}
#awList{display:flex;flex-direction:column;gap:4px}
.awRow{display:flex;justify-content:space-between;gap:8px;font-size:18px;color:var(--ink-dim)}
.awRow b{font-weight:normal;color:var(--ink-hi)}
.parts{display:flex;flex-direction:column;gap:3px}
.prow{display:flex;justify-content:space-between;gap:8px;font-size:17px;line-height:1.1;color:var(--ink-dim)}
.prow span:last-child{color:var(--ink-hi)}
.trash{width:74px;height:26px;font-size:13px;line-height:1;letter-spacing:0;
  border-color:var(--line-dim);color:var(--ink-off)}
.trash.arm{border-color:var(--warn);color:var(--warn)}
.crw{flex:0 0 auto;display:flex;flex-direction:column;gap:3px}
.crw .trash{width:66px}
.donate{width:74px;height:30px;font-size:13px;line-height:1;letter-spacing:0;
  padding:0;border-color:var(--hud);color:var(--hud)}

#toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);border:1px solid var(--hud);
  background:var(--panel);color:var(--hud);padding:10px 16px;font-size:24px;letter-spacing:1px;
  pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;white-space:pre-line;z-index:50}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

  <div id="top">
    <div class="chip row" id="coinBox">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1 15,8 8,15 1,8" fill="#c9a14a"></polygon><polygon points="8,4 12,8 8,12 4,8" fill="#f0d489"></polygon></svg>
      <span id="coins">0</span>
      <span id="rate"></span>
    </div>
    <button class="btn" id="crewBtn" type="button" aria-label="Бригада">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12"></path></svg>
    </button>
    <button class="btn" id="sound" type="button" aria-label="Звук">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7h3l4-3v10l-4-3H3z"></path><path id="wave" d="M12.5 6.5a3.5 3.5 0 010 5"></path></svg>
    </button>
  </div>

  <div id="meta">
    <span class="small" id="metaL">—</span>
    <span class="small" id="metaR" style="color:var(--hud)"></span>
  </div>

  <div id="goal"><span id="goalT">—</span><span id="goalR"></span></div>

  <div id="crewPanel"></div>

  <div id="ev"><div id="evRow"><span id="evT"></span><span id="evX"></span></div><div id="evBar"><i></i></div></div>

  <div class="screen on" id="scDig">
    <div id="holePick"></div>
    <div class="pit" id="digPit">
      <canvas id="digUnder"></canvas>
      <canvas id="digDirt"></canvas>
      <canvas id="digFx"></canvas>
      <div class="fx dither"></div><div class="fx scan"></div><div class="fx vig"></div>
      <div class="tag" id="digTag">УЧАСТОК НЕ ТРОНУТ</div>
      <div class="tag" id="digHold">КОПАТЕЛЬ НА ПАУЗЕ</div>
      <div class="tag skid" id="digSkid">ЛОПАТА СКОЛЬЗИТ</div>
    </div>
    <div class="digWork">
      <div class="row" style="justify-content:space-between;margin-bottom:5px">
        <span class="small" id="digName">—</span>
        <button class="btn hsw" id="holeBtn" type="button">ЛУНКИ</button>
        <span class="small" id="digPct">0%</span>
      </div>

function makeHole(k, r){
 var t = typeOf(k), mats = [], pool = poolsAt(r), set = LOC_MATS[r];
 for(var i = 0; i < t.mats.length; i++){
  var mi = t.mats[i];
  /* Два одинаковых слоя подряд читаются как «ничего не изменилось»: после
     снятия листа порода обязана смениться и цветом, и на ощупь. */
  if(mats.length && set[mi] === mats[mats.length - 1]) mi = (mi + 1) % set.length;
  mats.push(set[mi]);
 }
 /* Две лунки с одинаковым именем в одном списке читаются как ошибка. */
 var taken = takenNames(r), nn = [];
 for(var j = 0; j < t.nn.length; j++) if(taken.indexOf(t.nn[j]) < 0) nn.push(t.nn[j]);

   прогресс может запереться, а платить за лопату будет нечем. */
function ensureEasy(r){
 var list = S.holes[r], lv = upLv("dig"), ok = false;
 for(var i = 0; i < 3; i++) if(list[i] && list[i].req <= lv) ok = true;
 if(!ok) list[0] = makeHole("easy", r);
}
function rollType(){
 var x = Math.random();
 return x < 0.42 ? "easy" : (x < 0.78 ? "mid" : "hard");
}
function genHoles(r){
 S.holes[r] = [];
 S.holes[r].push(makeHole("easy", r));
 S.holes[r].push(makeHole("mid", r));
 S.holes[r].push(makeHole(rollType(), r));
 S.holes[r].push(null);
 ensureEasy(r);
}
/* Таблицы пород объявлены ниже сейва, поэтому лунки поднимаем не при загрузке,
   а в общем старте — иначе genHoles читает ещё не созданные LOC_MATS. */
function initHoles(){
 if(!S.holes || S.holes.length !== LOC.length) S.holes = [[], [], []];
 for(var r = 0; r < LOC.length; r++){
  if(!S.holes[r] || !S.holes[r].length) genHoles(r);
  else ensureEasy(r);
 }
}
function holes(){ return S.holes[S.loc]; }
function curHole(){ var l = holes(); return S.hole >= 0 && l ? l[S.hole] : null; }
function adReady(){ return Date.now() >= (S.adAt || 0) || (S.adFinds || 0) >= AD_FINDS; }

function loc(){ return LOC[S.loc]; }
function arts(){ return ART[S.loc]; }

/* ---------- звук ---------- */

var AC = null;
function beep(f, d, type, vol){
 if(!S.sound) return;
 try{
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === "suspended") AC.resume();
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square"; o.frequency.value = f;
  g.gain.value = vol || 0.03;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + d);
 }catch(e){}
}
function no(){ beep(120, .09, "sawtooth", .03); }

function fmt(n){
 n = Math.floor(n);
 if(n < 10000) return String(n);
 if(n < 1e6) return (n / 1e3).toFixed(1) + "К";
 return (n / 1e6).toFixed(2) + "М";
}
function toast(t){
 var el = document.getElementById("toast");
 el.textContent = t; el.classList.add("on");
 clearTimeout(el._t);
 el._t = setTimeout(function(){ el.classList.remove("on"); }, 1200);
}
function poly(ctx, pts, x, y, w, h, color){
 ctx.fillStyle = color; ctx.beginPath();
 for(var i = 0; i < pts.length; i++){
  var px = x + pts[i][0] * w, py = y + pts[i][1] * h;
  if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
 }
 ctx.closePath(); ctx.fill();
}
function svgOf(a, size, flat){
 var s = '<svg viewBox="0 0 1 1" width="' + size + '" height="' + size + '" aria-hidden="true">';
 for(var i = 0; i < a.p.length; i++){
  s += '<polygon points="' + a.p[i].g.map(function(q){ return q[0] + "," + q[1]; }).join(" ") +
       '" fill="' + (flat || a.p[i].c) + '"></polygon>';
 }
 return s + "</svg>";
}
function qualMult(q){ return q >= 0.999 ? 2.0 : (q >= 0.70 ? 1.0 : (q >= 0.40 ? 0.6 : 0.25)); }

/* ---------- коллекция ----------
   Экспонат — находка, очищенная до 100%. Наёмник доводит вещь до 50–85% и этой
   планки не берёт никогда, поэтому альбом заполняется только ручной игрой.
   Отдельный флаг «кто копал» не нужен: качество и есть правило. */
var TIER_N = 4, TIERS = 3;
var TIER_NAME = ["РЯДОВЫЕ", "РЕДКИЕ", "УНИКАЛЬНЫЕ"];
var TIER_W = [0.60, 0.32, 0.08];      /* шансы выпадения по ярусам */
var SET_MULT  = [1.25, 1.6, 2.5];     /* надбавка к цене продажи за собранный ярус */
var SET_SALES = [10, 25, 50];         /* на сколько продаж её хватает */
var PITY = 50;                        /* идеальных чисток до гарантированной уникальной */

function tierOf(i){ return Math.floor(i / TIER_N); }
function albumCount(r){
 var n = 0;
 for(var i = 0; i < ART[r].length; i++) if(S.album[r][i]) n++;
 return n;
}
function albumTier(r, t){
 var n = 0;
 for(var i = t * TIER_N; i < (t + 1) * TIER_N && i < ART[r].length; i++) if(S.album[r][i]) n++;
 return n;
}
function albumFull(r){ return albumCount(r) >= ART[r].length; }

/* ---------- собранный ярус: заряд на продажи ----------
   Коллекция не вечная. Собранная четвёрка даёт надбавку к цене, отрабатывает
   свои продажи и сгорает вместе с вещами: ярус приходится собирать заново.
   Пока активны несколько, тратится сначала самая дорогая. */
function setOf(r, t){
 for(var i = 0; i < S.sets.length; i++) if(S.sets[i].r === r && S.sets[i].t === t) return S.sets[i];
 return null;
}
function bestSet(){
 var b = null;
 for(var i = 0; i < S.sets.length; i++) if(!b || S.sets[i].t > b.t) b = S.sets[i];
 return b;
}
function saleMult(){ var b = bestSet(); return b ? SET_MULT[b.t] : 1; }
function armSet(r, t){
 if(setOf(r, t) || albumTier(r, t) < TIER_N) return null;
 var x = {r:r, t:t, left:SET_SALES[t]};
 S.sets.push(x);
 return x;
}
function spendSet(){
 var b = bestSet();
 if(!b) return;
 b.left--;
 if(b.left > 0) return;
 for(var i = b.t * TIER_N; i < (b.t + 1) * TIER_N && i < ART[b.r].length; i++) S.album[b.r][i] = 0;
 for(var k = S.sets.length - 1; k >= 0; k--) if(S.sets[k] === b) S.sets.splice(k, 1);
 toast(TIER_NAME[b.t] + " · " + LOC[b.r].n + "\nКОЛЛЕКЦИЯ ОТРАБОТАЛА\nСОБИРАЙ ЗАНОВО");
}

/* Пока игрок не нанял копателя и чистильщика, из земли идут только рядовые вещи:
   редкое приходит вместе с подсказкой про альбом, а не раньше неё. */
function crewReady(){ return !!(S.digger[S.loc] && S.cleaner[S.loc]) || S.loc > 0 || S.tut >= TUT.length; }

/* Что лежит в новом участке. Уникальные редки, но счётчик жалости не даёт
   им пропасть навсегда: он считает идеальные чистки, то есть растёт только
   от ручной игры, а не от скорости копания. */
function pickTier(){
 var h = curHole(), w = h ? h.odds : TIER_W;
 var x = Math.random(), a = 0;
 for(var t = 0; t < TIERS; t++){ a += w[t]; if(x < a) return t; }
 return 0;
}
/* Та же вещь два раза подряд — главный источник ощущения «мне падают одни
   скарабеи». Вес последней находки режется вчетверо: повтор остаётся возможным,
   но перестаёт быть обычным делом. Полный запрет не ставим — он бы читался
   как очередь по кругу. */
function repeatW(i){ return S.lastIdx === i ? 0.25 : 1; }
/* Пласт лунки не меняет ярус, он меняет, какая именно вещь яруса выпадет. */
function pickInTier(from, n){
 var h = curHole(), list = arts(), w = [], sum = 0;
 for(var i = 0; i < n; i++){
  /* Пласт был ×3, и в ярусе из четырёх вещей единственная вещь нужного
     материала забирала половину выпадений — отсюда «мне падают одни скарабеи».
     На ×2 пласт остаётся способом влиять на поиск, но перестаёт быть спамом:
     35% против 21% у остальных. */
  var k = (h && list[from + i] && list[from + i].m === h.pool) ? 2 : 1;
  k *= repeatW(from + i);
  w.push(k); sum += k;
 }
 var x = Math.random() * sum, a = 0;
 for(var j = 0; j < n; j++){ a += w[j]; if(x < a) return from + j; }
 return from;
}
/* Уникальные, которых ещё нет в альбоме. Гарантия выдаёт именно их:
   дубликат не двигает коллекцию и гарантию бы обесценил. */
function missingUnique(){
 var out = [], from = (TIERS - 1) * TIER_N, list = ART[S.loc];
 for(var i = from; i < Math.min(list.length, from + TIER_N); i++) if(!S.album[S.loc][i]) out.push(i);
 return out;
}
function pickIdx(){
 var out = pickIdxRaw();
 S.lastIdx = out;
 return out;
}
function pickIdxRaw(){
 var list = ART[S.loc], commonN = Math.min(TIER_N, list.length);
 /* Первая находка в игре жёстко зафиксирована: дешёвый скарабей. Продажа за него
    не должна сразу окупать копателя, иначе игрок проскакивает весь ручной цикл. */
 if(!S.firstFind && S.loc === 0) return 0;
 /* Одну уникальную вещь выдаём ещё в туторе: к моменту, когда откроется альбом,
    у игрока уже лежит то, ради чего он открывается. */
 if(!S.uniqGift && crewReady()){
  var g = missingUnique();
  if(g.length){ S.uniqGift = 1; S.pity = 0; return g[Math.floor(Math.random() * g.length)]; }
 }
 if(!albumOn()) return pickInTier(0, commonN);
 if(S.pity >= PITY){
  var m = missingUnique();
  if(m.length){ S.pity = 0; return m[Math.floor(Math.random() * m.length)]; }
 }
 var t = pickTier(), from = t * TIER_N;
 var n = Math.min(TIER_N, list.length - from);
 if(n <= 0){ t = 0; from = 0; n = commonN; }
 var i2 = pickInTier(from, n);
 if(t === TIERS - 1 && !S.album[S.loc][i2]) S.pity = 0;
 return i2;
}
/* Наёмный копатель приносит только рядовые вещи: редкое и уникальное
   достаётся тому, кто копает сам. */
function botIdx(){
 var i = pickInTier(0, Math.min(TIER_N, arts().length));
 S.lastIdx = i;
 return i;
}
/* Наёмник разбирает ящик подряд и сам. Дойдя до ценной вещи, он её не портит,
   а откладывает: своими руками он даёт 50–85%, а экспонат для альбома — это 100%.
   Метка «отложено» и есть опознание: на раскопе про находку не известно ничего,
   а профессионал, взяв её в руки, говорит, что она не по его части.
   Тумблер «чистить всё подряд» снимает запрет целиком, вместе с коллекцией. */
function botCrateIdx(){
 for(var i = 0; i < S.crate.length; i++){
  var it = S.crate[i];
  /* Находку, которую игрок выбрал себе, наёмник не забирает. */
  if(it.u === S.clnPick) continue;
  if(it.aside && !S.clnAll) continue;
  return i;
 }
 return -1;
}
function botSkips(it){ return !S.clnAll && tierOf(it.i) > 0; }
function mgrStoreIdx(){
 for(var i = 0; i < S.store.length; i++) if(S.mgrTier[tierOf(S.store[i].i)]) return i;
 return -1;
}
/* Уровни лавки остаются в своём городе, но не пропадают: они поднимают
   автономный доход этой локации после переезда. */
function passiveOf(r){ return LOC[r].passive * (1 + 0.05 * shopSum(r)); }
function isExhibit(it){ return it.q >= 0.999; }
function canDonate(it){ return albumOn() && isExhibit(it) && !S.album[it.loc][it.i]; }
/* Альбом появляется только после туторных шагов про него: до этого на экране
   нет ни вкладки, ни кнопки сдачи, и объяснять нечего. */
function albumOn(){ return !!S.seen.album || S.tut >= ALBUM_END; }
function qualColor(q){ return q >= 0.999 ? "var(--hud)" : (q >= 0.70 ? "var(--ink-hi)" : (q >= 0.40 ? "var(--gold)" : "var(--warn)")); }

var screen = "dig";
var SCR = {dig:"scDig", clean:"scClean", shop:"scShop", map:"scMap", album:"scAlbum"};
var NAV = {dig:"navDig", clean:"navClean", shop:"navShop", map:"navMap", album:"navAlbum"};

 screen = k;

/* ---------- общий ввод ---------- */

function bindStroke(el, step, onHit){
 var down = false, last = null, acc = 0;
 function pt(e){ var r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top, Date.now()]; }
 el.addEventListener("pointerdown", function(e){
  down = true; el.setPointerCapture(e.pointerId);
  last = pt(e); acc = 0; onHit(last[0], last[1], 0); e.preventDefault();
 });
 el.addEventListener("pointermove", function(e){
  if(!down) return;
  var p = pt(e), dx = p[0] - last[0], dy = p[1] - last[1];
  var dist = Math.sqrt(dx * dx + dy * dy), dt = Math.max(1, p[2] - last[2]);
  var speed = dist / dt;
  acc += dist;
  var n = Math.floor(acc / step);
  if(n > 0){
   acc -= n * step; n = Math.min(n, 12);
   for(var k = 1; k <= n; k++) onHit(last[0] + dx * (k / n), last[1] + dy * (k / n), speed);
  }
  last = p; e.preventDefault();
 });
 ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
  el.addEventListener(ev, function(){ down = false; last = null; });
 });
}

/* ---------- эффекты ----------

   Раскоп и чистка ощущаются по-разному, поэтому и сыплется из них разное:
   из породы летят осколки её же цвета, с чисткой поднимается медленная пыль.
   Частицы живут на отдельном холсте поверх грунта и гаснут сами. */

var dParts = [], cParts = [], fxRaf = 0;
function fxStart(){ if(!fxRaf) fxRaf = requestAnimationFrame(fxFrame); }
function fxFrame(){
 fxRaf = 0;
 var now = Date.now();
 if(dParts.length || dxFDirty){ fxDraw(dxF, dParts, dW, dH, now); dxFDirty = dParts.length > 0; }
 if(cParts.length || cxFDirty){ fxDraw(cxF, cParts, cW, cH, now); cxFDirty = cParts.length > 0; }
 if(dParts.length || cParts.length) fxStart();
}
var dxFDirty = false, cxFDirty = false;
function fxDraw(cx, arr, w, h, now){
 cx.clearRect(0, 0, w, h);
 for(var i = arr.length - 1; i >= 0; i--){
  var p = arr[i], t = (now - p.t0) / p.ms;
  if(t >= 1){ arr.splice(i, 1); continue; }
  p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= p.dr; p.vy *= p.dr;
  cx.globalAlpha = (1 - t) * p.a;
  cx.fillStyle = p.c;
  var sz = p.s * (p.grow ? 1 + t * 1.6 : 1);
  cx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
 }
 cx.globalAlpha = 1;
}
/* Осколки породы: летят от удара, падают вниз, цвет берут у слоя. */
function fxDig(x, y, n, big){
 var pal = dMat.pal;
 for(var i = 0; i < n; i++){
  var a = Math.random() * Math.PI * 2, sp = (big ? 1.1 : 0.6) + Math.random() * 1.3;
  dParts.push({x:x, y:y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - (big ? 1.4 : 0.8),
   g:0.16, dr:0.98, a:0.9, s:(big ? 3.5 : 2.5) + Math.random() * 2.5,
   c:pal[Math.floor(Math.random() * 3)], t0:Date.now(), ms:360 + Math.random() * 320, grow:false});
 }
 if(dParts.length > 200) dParts.splice(0, dParts.length - 200);
 dxFDirty = true; fxStart();
}
/* Пыль с чистки: медленная, светлая, расплывается вверх. */
function fxClean(x, y, n, chip){
 for(var i = 0; i < n; i++){
  var a = Math.random() * Math.PI * 2, sp = 0.15 + Math.random() * 0.35;
  cParts.push({x:x, y:y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 0.22,
   g:chip ? 0.05 : -0.012, dr:0.985, a:chip ? 0.75 : 0.42,
   s:(chip ? 2.5 : 3.5) + Math.random() * 2.5,
   c:chip ? "#c4622e" : (Math.random() < 0.5 ? "#d8c9ab" : "#9c8763"),
   t0:Date.now(), ms:chip ? 420 : 900 + Math.random() * 500, grow:!chip});
 }
 if(cParts.length > 160) cParts.splice(0, cParts.length - 160);
 cxFDirty = true; fxStart();
}

/* ---------- фаза 1: раскоп ---------- */

var dPit = document.getElementById("digPit");
var dcU = document.getElementById("digUnder"), dcD = document.getElementById("digDirt");
var dcF = document.getElementById("digFx");
var dxU = dcU.getContext("2d"), dxD = dcD.getContext("2d"), dxF = dcF.getContext("2d");
var dW = 0, dH = 0, dCell = 16, dCols = 12, dRows = 16;
var dHp = null, dKind = null, dMaxHp = 1, dTotal = 1, dDone = 0, dSite = null, dTouched = 0;
/* Слои идут листами: снял лист породы — под ним следующий, и так до последнего,
   под которым лежит находка. Перейти к следующему листу можно, сняв BREAK клеток:
   остаток осыпается сам, иначе участок приходится вытирать ровно и без выбора. */
var dLayer = 0, dMat = MAT.sand, dReady = false, skidAt = 0;
/* На раскопе находку не опознать вообще: виден только тёмный силуэт в корке.
   Что именно выкопано, выясняется на чистке — там и стоит момент открытия.
   Раскоп отдаёт игроку ярус («редкое»), чтобы решение, чем заняться дальше,
   всё-таки было на чём строить. */
/* Порода в участке неоднородна: мягкие промоины и твёрдые желваки. Копание
   становится выбором маршрута, а не равномерным возюканьем пальцем. */
var SOFT = 0.55, HARD = 1.8;

function newSite(){
 var h = curHole();
 if(!h){ dSite = null; return; }
 var a = arts()[pickIdx()];
 var bw = 0.44 + Math.random() * 0.14, bh = bw * (0.95 + Math.random() * 0.3);
 var bx = 0.14 + Math.random() * (0.72 - bw), by = 0.16 + Math.random() * (0.66 - bh);
 dSite = {art:a, bx:bx, by:by, bw:bw, bh:bh};
 dLayer = 0;
 layoutDig();
}
/* Уровень лопаты, при котором после вычитания сопротивления остаётся хотя бы 0.5:
   клетка ломается не дольше шести ударов. */
function reqLv(res){
 for(var lv = 0; lv <= 5; lv++) if(1.5 + 0.3 * lv - res >= 0.5) return lv;
 return 5;
}
function layerMat(h, k){ return MAT[h.mats[Math.min(k, h.mats.length - 1)]]; }
function layoutDig(){
 var h = curHole();
 if(!dSite || !h) return;
 dMat = layerMat(h, dLayer);
 dMaxHp = 2.6 * loc().hard * dMat.hp;
 dHp = new Float32Array(dCols * dRows);
 dKind = new Uint8Array(dCols * dRows);
 dTotal = dCols * dRows; dDone = 0; dTouched = 0; dReady = false;
 for(var b = 0; b < 6; b++){
  var kind = b < 3 ? 1 : 2;
  var bxc = Math.random() * dCols, byc = Math.random() * dRows, r = 1.4 + Math.random() * 1.6;
  for(var yy = 0; yy < dRows; yy++) for(var xx = 0; xx < dCols; xx++){
   var ddx = xx + 0.5 - bxc, ddy = yy + 0.5 - byc;
   if(ddx * ddx + ddy * ddy <= r * r) dKind[yy * dCols + xx] = kind;
  }
 }
 for(var y = 0; y < dRows; y++) for(var x = 0; x < dCols; x++){
  var i = y * dCols + x;
  dHp[i] = dMaxHp * (0.8 + Math.random() * 0.4) * (dKind[i] === 1 ? SOFT : (dKind[i] === 2 ? HARD : 1));
 }
 dParts.length = 0; dxF.clearRect(0, 0, dW, dH);
 drawDigUnder(); drawDigAll();
}
/* Под снятыми клетками видно следующий лист, а под последним — саму находку.
   Это и даёт ощущение глубины без вертикальных полос. */
function drawDigUnder(){
 var h = curHole();
 dxU.fillStyle = "#1c150f"; dxU.fillRect(0, 0, dW, dH);
 if(h && dLayer < h.mats.length - 1){
  var nm = layerMat(h, dLayer + 1);
  for(var y = 0; y < dRows; y++) for(var x = 0; x < dCols; x++){
   var t = (x * 7 + y * 13) % 3;
   dxU.fillStyle = nm.pal[t];
   dxU.fillRect(x * dCell, y * dCell, dCell, dCell);
   dxU.fillStyle = "rgba(0,0,0,.42)";
   dxU.fillRect(x * dCell, y * dCell, dCell, dCell);
   dxU.fillStyle = "rgba(0,0,0,.22)";
   dxU.fillRect(x * dCell, y * dCell + dCell - 1, dCell, 1);

  return;
 }
 dxU.fillStyle = "#15100b"; dxU.fillRect(0, 0, dW, dH);
 var pal = loc().pal;
 for(var k = 0; k < 22; k++){
  var fx = ((k * 97) % 100) / 100 * dW, fy = ((k * 53) % 100) / 100 * dH, sz = 30 + (k % 5) * 18;
  dxU.fillStyle = pal[k % 3]; dxU.globalAlpha = 0.22 + (k % 4) * 0.05;
  dxU.beginPath(); dxU.moveTo(fx, fy); dxU.lineTo(fx + sz, fy + sz * 0.4);
  dxU.lineTo(fx + sz * 0.5, fy + sz); dxU.closePath(); dxU.fill();

 for(var i = 0; i < a.p.length; i++) poly(dxU, a.p[i].g, bx, by, bw, bh, "#32251a");
}
function paintDigCell(x, y){

/* Лопата не берёт породу, если её урон не перебивает сопротивление слоя.

function digAt(px, py){

 /* Тот же запас по краю, что и на чистке: у самой кромки ямы палец не достаёт
    до центра крайней клетки, и слой не добивался. */

 var vein = veinOn(), rad = vein ? 2 : 1;

  var x = x0 + dx, y = y0 + dy;

/* ---------- фаза 2: чистка ---------- */

var cPit = document.getElementById("clnPit");

/* Опознание живёт здесь, а не на раскопе: до ID_AT находка — тёмный силуэт под

   цель, ради которой стоит чистить руками. */
var ID_AT = 0.6, cLit = false;

function clearClean(){
 cxU.clearRect(0, 0, cW, cH);

 cParts.length = 0; cxF.clearRect(0, 0, cW, cH);
 cTotal = 1; cDone = 0;
}
function crateIdxOf(u){
 for(var i = 0; i < S.crate.length; i++) if(S.crate[i].u === u) return i;
 return -1;
}
/* Чистим ту находку, которую выбрал игрок. Если её уже нет — первую в ящике. */
function ensureClean(){
 if(cItem) return;

 var k = crateIdxOf(S.clnPick);
 if(k < 0) k = 0;
 var raw = S.crate[k];
 S.clnPick = raw.u;

function layoutClean(){

 cTotal = 0; cDone = 0; cLit = false;
 var f1x = 0.25 + Math.random() * 0.2, f1y = 0.25 + Math.random() * 0.2;
 var f2x = 0.55 + Math.random() * 0.2, f2y = 0.5 + Math.random() * 0.25;

  var i = y * cCols + x;
  var u = (x + 0.5) / cCols, v = (y + 0.5) / cRows;
  /* Корка не доходит до самой кромки ямы: у нижнего края палец упирается
    в край экрана и в кнопку, и последние клетки выцарапывались с боем. */
 if(u < 0.14 || u > 0.86 || v < 0.08 || v > 0.90) continue;
  cHp[i] = 1.3 + Math.random() * 0.5;

  var d1 = Math.hypot(u - f1x, v - f1y), d2 = Math.hypot(u - f2x, v - f2y);

function paintCleanCell(x, y){

  cxC.fillStyle = cHurt[i] ? "rgba(196,98,46,.55)" : "rgba(196,98,46,.30)";
  cxC.fillRect(x * cCell, y * cCell, cCell, cCell);

 cxC.fillStyle = "rgba(0,0,0,.20)";

}

var FRAG_COST = 0.025, brushSound = 0, chipShown = false;
function brushAt(px, py, speed){
 if(!cItem) return;
 /* У края ямы палец физически не дотягивается до центра крайней клетки:
    координату подрезаем в сетку, иначе последний ряд остаётся недостижимым. */

  var x = x0 + dx, y = y0 + dy;
  if(x < 0 || y < 0 || x >= cCols || y >= cRows) continue;
  var i = y * cCols + x;
  if(cHp[i] <= 0) continue;
  if(cFrag[i] && speed > lim && !cHurt[i]){
   cHurt[i] = 1; cQual = Math.max(0.25, cQual - FRAG_COST);
   fxClean(x * cCell + cCell / 2, y * cCell + cCell / 2, 5, true);
   beep(160, .06, "sawtooth", .035);
   if(!chipShown){ chipShown = true; toast("СКОЛ\nНА ОРАНЖЕВОМ ВЕДИ МЕДЛЕННЕЕ"); }
  }
  cHp[i] = Math.max(0, cHp[i] - bd * (dx === 0 && dy === 0 ? 1 : 0.7));

  fxClean(px, py, 2, false);
  if(Date.now() - brushSound > 80){
   brushSound = Date.now();

  }

   cLit = true; drawCleanUnder();
   beep(587, .09, "square", .04); setTimeout(function(){ beep(880, .13, "square", .035); }, 100);
   toast("ЭТО " + cItem.art.n);
  }
  /* Корка осыпается при том же пробое, что и слой на раскопе. Раньше порог был

bindStroke(cPit, 9, function(x, y, sp){ brushAt(x, y, sp); });

function finishClean(){
 if(!cItem || cDone < cTotal || S.store.length >= storeMax()) return;
 var ci = crateIdxOf(cItem.u);
 if(ci >= 0) S.crate.splice(ci, 1); else S.crate.shift();
 S.clnPick = 0;
 S.store.push({loc:cItem.loc, i:cItem.i, q:cQual, u:newUid(), h:1});
 mark("clean");
 if(cQual >= 0.999){ S.perfect[S.loc]++; S.pity++; }
 var first = cQual >= 0.999 && !S.seen.exh;
 if(cQual >= 0.999) S.seen.exh = 1;
 var pretty = Math.round(cQual * 100);
 toast(cItem.art.n + "\n" + (pretty >= 100 ? "БЕЗ ЕДИНОЙ ЦАРАПИНЫ" : "КАЧЕСТВО " + pretty + "%") +
  (first ? "\nЭТО ЭКСПОНАТ · ОТКРЫТ АЛЬБОМ" : ""));

document.getElementById("clnCta").onclick = finishClean;

/* ---------- фаза 3: лавка ---------- */

var deals = [], dealEnds = 0;
/* Покупатели больше не уходят по таймеру: предложение висит, пока игрок не
   продаст или не откажет. Фаза продажи из реакции становится разбором очереди,
   поэтому у очереди обязан быть потолок — иначе прилавок забьётся навсегда. */
var DEAL_FIRST = 20000, QUEUE_CAP = 5;
var dealAt = Date.now() + DEAL_FIRST;
function dealWait(){
 if(S.sold === 0) return DEAL_FIRST;
 var L = loc(), w = L.waveMin + Math.random() * (L.waveMax - L.waveMin);
 /* Пока на витрине один-два предмета, покупателю всё равно достанется только
    один из них. Ждать полный интервал в этот момент — это просто пустой экран. */
 var free = freeShelf().length;
 return w * (free >= 3 ? 1 : (free === 2 ? 0.75 : 0.5)) * signMul();
}
function scheduleWave(ms){ dealAt = Date.now() + (ms === undefined ? dealWait() : ms); }
function newUid(){ return S.uid++; }
/* Расписание первой сессии проверяется цифрами, а не на глаз: отмечаем время
   первого раза для каждого ключевого шага. Видно только в консоли. */
function mark(k){
 if(!S.firstAt) S.firstAt = {};
 if(S.firstAt[k] === undefined){ S.firstAt[k] = Math.round((Date.now() - (S.born || Date.now())) / 1000); save(); }
}
function shelfOf(u){
 for(var i = 0; i < S.shelf.length; i++) if(S.shelf[i].u === u) return S.shelf[i];
 return null;
}
function dealOf(u){
 for(var i = 0; i < deals.length; i++) if(deals[i].u === u) return deals[i];
 return null;
}
function dropDeal(u, why){
 for(var i = 0; i < deals.length; i++) if(deals[i].u === u){ deals.splice(i, 1); break; }
 if(why) toast(why);
 if(screen === "shop") paintShop();
 sync();
}

function freeShelf(){
 var f = [];
 for(var i = 0; i < S.shelf.length; i++) if(!dealOf(S.shelf[i].u)) f.push(S.shelf[i]);
 return f;
}
/* Единственный покупатель за весь тутор приходит по сценарию: когда игрок увёл
   вторую находку на чистку, а первая всё ещё стоит на прилавке. Он бессрочный —
   тутор обещал, что покупатель дождётся, и обещание не должно съедаться таймером. */
function tutDealCheck(){
 if(S.tutBuy || S.tut >= FREE_STEP) return;
 if(S.digLoc[S.loc] < 2 || !cItem || !S.shelf.length) return;
 /* Покупатель всегда музей: тутор называет его по имени, и подменять его туристом
    из-за низкого качества нельзя. Пол цены — чтобы первая продажа не вышла в копейки,
    если игрок на чистке торопился. */
 /* Денег с этой продажи должно хватить ровно на первый уровень лопаты — следующий
    шаг тутора ведёт в прокачку, — но не на копателя: автоматизацию игрок покупает сам. */
 var it = S.shelf[0], b = BUYERS[1];
 var tp = priceParts(it, b);
 S.tutBuy = 1;
 tp.sum = Math.max(upCost("dig") + 20, tp.sum);
 deals.push({b:b, u:it.u, sum:tp.sum, p:tp, min:false, tut:true});
 beep(494, .07, "square", .035);
 toast("ПОКУПАТЕЛЬ У ВИТРИНЫ\nОН ДОЖДЁТСЯ");
 if(screen === "shop") paintShop();
}
/* Цена раскладывается на множители и показывается игроку по строкам: иначе
   он видит одно число и не понимает, за что ему заплатили. Разбор считается
   один раз, в момент прихода покупателя, и больше не пересчитывается. */
function priceParts(it, b){
 var a = ART[it.loc][it.i];
 var p = {base:a.v, loc:LOC[it.loc].mult, qual:qualMult(it.q), buyer:b.m,
          rep:repMult(), hype:hypeOn() ? HYPE_MULT : 1,
          luck:0.9 + Math.random() * 0.2};
 p.sum = Math.max(1, Math.round(p.base * p.loc * p.qual * p.buyer * p.rep * p.hype * p.luck));
 return p;
}
function offerFor(it, b){ return priceParts(it, b).sum; }
function partRows(d, it){
 var p = d.p, r = [["БАЗА · " + ART[it.loc][it.i].n, fmt(p.base)],
  ["ЛОКАЦИЯ", "×" + p.loc.toFixed(2)],
  ["КАЧЕСТВО " + Math.round(it.q * 100) + "% · " + (it.h ? "ЧИСТИЛ ТЫ" : "НАЁМНИК"), "×" + p.qual.toFixed(2)],
  ["ПОКУПАТЕЛЬ · " + d.b.n, "×" + p.buyer.toFixed(2)],
  ["РЕПУТАЦИЯ · " + repName(repOf()), "×" + p.rep.toFixed(2)]];
 var b0 = bestSet();
 r.push(["КОЛЛЕКЦИЯ" + (b0 ? " · ОСТАЛОСЬ " + b0.left : ""), "×" + saleMult().toFixed(2)]);
 if(p.hype > 1) r.push(["АЖИОТАЖ", "×" + p.hype.toFixed(2)]);
 r.push(["УДАЧА", p.luck >= 1 ? "ПОВЕЗЛО" : "КАК ВЫШЛО"]);
 return r;
}
/* Состав потока двигают два разных рычага. Оценщик покупается за деньги и
   решает, кто вообще заходит. Репутация зарабатывается решениями и решает,
   как часто вместо дорогого покупателя приходит перекупщик. */
function buyerW(){
 var w = [1, 1, 1, 1], e = shopLv("eye"), r = repOf();
 var up = 1 + 0.15 * e, dn = Math.pow(0.85, e);
 w[0] *= dn; w[3] *= dn; w[1] *= up; w[2] *= up;
 if(r < 30){ w[3] *= 2; w[0] *= 1.5; }
 else if(r > 70){ w[1] *= 2; w[2] *= 2; }
 return w;
}
function pickBuyer(){
 var w = buyerW(), t = 0, i;
 for(i = 0; i < w.length; i++) t += w[i];
 var x = Math.random() * t, a = 0;
 for(i = 0; i < w.length; i++){ a += w[i]; if(x < a) return BUYERS[i]; }
 return BUYERS[0];
}
function addBuyer(){
 if(deals.length >= maxDeals()) return false;
 var free = freeShelf();
 if(!free.length) return false;
 var b = pickBuyer();
 var ok = [];
 for(var j = 0; j < free.length; j++) if(free[j].q >= b.min) ok.push(free[j]);
 if(!ok.length) return false;
 var it = ok[Math.floor(Math.random() * ok.length)];
 var pp = priceParts(it, b);
 deals.push({b:b, u:it.u, sum:pp.sum, p:pp, min:false});
 return true;
}
/* Между первой продажей и второй находкой случайные покупатели не приходят:
   в этом окне тутор ведёт игрока к лункам, а покупатель у витрины дёргал бы его
   обратно в лавку и запускал шаги про продажу раньше времени. Первый покупатель
   (за скарабея) по сценарию нужен, второго сажает tutBuyer. */
function wavesOn(){ return S.tut >= FREE_STEP; }
function newWave(){
 if(!wavesOn()){ scheduleWave(); return; }
 var want = 1 + Math.floor(Math.random() * maxDeals()), got = 0;
 for(var i = 0; i < want; i++) if(addBuyer()) got++;
 scheduleWave();
 if(got){
  beep(440, .06, "square", .03);
  if(screen === "shop") paintShop();
  sync();
 }
}

/* Репутацию двигают только решения игрока. Менеджер даёт четверть плюса и
   не даёт минусов: иначе автоматизация сама нагонит сотню, и решение исчезнет. */
function repForSale(d, it, auto){
 var b = d.b, q = it.q, v = 0;
 if(q >= 0.999) v = 2;
 else if((b === BUYERS[1] || b === BUYERS[2] || b === VIP) && q >= 0.70) v = 1;
 if(b === BUYERS[3] && q >= 0.70) v = -2;
 else if(b !== BUYERS[3] && q < 0.40) v = -1;
 if(auto) v = v > 0 ? v * 0.25 : 0;
 if(v) addRep(v);
}
function sellDeal(u, auto){
 var d = dealOf(u), it = shelfOf(u);
 if(!d || !it) return no();
 var a = ART[it.loc][it.i];
 var m = saleMult(), paid = Math.round(d.sum * m);
 repForSale(d, it, auto);
 S.coins += paid; S.sold++; S.soldLoc[S.loc]++;
 mark("sale");
 for(var i = 0; i < S.shelf.length; i++) if(S.shelf[i].u === u){ S.shelf.splice(i, 1); break; }
 spendSet();
 toast(a.n + "\n+" + fmt(paid) + (m > 1 ? "\nКОЛЛЕКЦИЯ ×" + m.toFixed(2) : ""));
 beep(523, .08, "square", .04); setTimeout(function(){ beep(784, .14, "square", .04); }, 90);
 for(var k = deals.length - 1; k >= 0; k--) if(deals[k].u === u) deals.splice(k, 1);
 save(); paintShop(); sync();
}
/* Отказ — законный ход и репутацию не трогает: иначе единственной стратегией
   становится продавать всё подряд. Он же единственный способ освободить слот
   очереди, поэтому кнопка стоит рядом с продажей, а не прячется. */
function refuseDeal(u){
 var d0 = dealOf(u);
 if(!d0) return no();
 if(d0.tut){ toast("ЭТОГО НЕ ОТПУСТИТЬ\nПРОДАВАЙ"); return no(); }
 beep(300, .06, "square", .03);
 dropDeal(u, "ПОКУПАТЕЛЬ УШЁЛ");
}

function displayItem(i){
 if(S.shelf.length >= shelfMax()) return no();
 var it = S.store[i];
 if(!it) return no();
 S.store.splice(i, 1);

}

   есть в qualMult, но её не видно ни на складе, ни в сделке — отсюда метка. */
function handTag(it){
 return '<div class="sh' + (it.h ? " by" : "") + '">' + (it.h ? "ЧИСТИЛ ТЫ" : "НАЁМНИК") + '</div>';
}

/* Выбросить находку. Рядовое уходит сразу, всё выше — по второму нажатию:
   случайно потерянный уникум — худшее, что может случиться на складе.
   Наёмники не выбрасывают ничего никогда, это ход только игрока. */
var trashArm = {u:0, at:0};
function trashArmed(u){ return trashArm.u === u && Date.now() - trashArm.at < 4000; }
function trashItem(u, where){
 var list = where === "crate" ? S.crate : S.store, idx = -1;
 for(var i = 0; i < list.length; i++) if(list[i].u === u){ idx = i; break; }
 if(idx < 0) return no();
 var it = list[idx], a = ART[it.loc][it.i];
 if(tierOf(it.i) > 0 && !trashArmed(u)){
  trashArm = {u:u, at:Date.now()};
  beep(220, .07, "square", .03);
  toast(a.n + " · " + TIER_NAME[tierOf(it.i)] +
   (albumOn() && !S.album[it.loc][it.i] ? "\nЭТОГО НЕТ В АЛЬБОМЕ" : "") + "\nЖМИ ЕЩЁ РАЗ, ЧТОБЫ ВЫБРОСИТЬ");
  crateSig = ""; shopSig = "";
  paintCrate(); if(screen === "shop") paintShop();
  return;
 }
 list.splice(idx, 1);
 trashArm = {u:0, at:0};
 beep(140, .09, "square", .03);
 toast(a.n + "\nВЫБРОШЕНО");
 if(where === "crate" && cItem && cItem.u === u){ cItem = null; clearClean(); ensureClean(); }
 crateSig = ""; shopSig = "";
 save(); paintCrate(); if(screen === "shop") paintShop(); sync();
}

/* Сдать экспонат. Ищем по стабильному id: пока игрок думает, менеджер мог
   сдвинуть склад, и индекс успел бы устареть. */
function donate(u){
 var idx = -1;
 for(var i = 0; i < S.store.length; i++) if(S.store[i].u === u){ idx = i; break; }
 if(idx < 0) return;

 S.store.splice(idx, 1);
 var armed = armSet(it.loc, tierOf(it.i));
 if(armed) addRep(5);
 beep(523, .10, "square", .05);
 setTimeout(function(){ beep(784, .16, "square", .05); }, 110);
 toast(ART[it.loc][it.i].n + "\n" + (armed
  ? TIER_NAME[armed.t] + " СОБРАНЫ\nЦЕНА ×" + SET_MULT[armed.t].toFixed(2) + " НА " + armed.left + " ПРОДАЖ"
  : "В АЛЬБОМЕ · " + albumTier(it.loc, tierOf(it.i)) + "/" + TIER_N));
 save(); paintShop();

}

function paintShop(){

 var wrap = document.getElementById("slots");

/* Перерисовка по таймеру убивала нажатия: карточка пересобиралась между
   нажатием и отпусканием пальца, и клик уходил в никуда. Теперь по таймеру
   обновляются только секунды, а весь экран — когда действительно изменился. */
var shopSig = "";
function shopState(){
 var b0 = bestSet();
 var a = [S.shelf.length, S.store.length, b0 ? b0.t + ":" + b0.left : "-"];
 for(var i = 0; i < deals.length; i++)
  a.push(deals[i].u + ":" + deals[i].sum + ":" + (deals[i].min ? 1 : 0) + ":" + (deals[i].open ? 1 : 0));
 a.push("|");
 for(var j = 0; j < S.shelf.length; j++) a.push(S.shelf[j].u);
 a.push("|");
 for(var k = 0; k < S.store.length; k++) a.push(S.store[k].u);
 return a.join(",");
}
function shopSync(){
 if(shopState() !== shopSig) paintShop();
}

/* ---------- карта ---------- */

function bankCap(r){ return passiveOf(r) * PASSIVE_CAP_MIN; }
function canTravel(r){
 return S.digger[S.loc] && S.cleaner[S.loc] && S.unlocked[r] === 0 && S.coins >= LOC[r].open;
}
/* Карта поделена на вкладки: одним списком локации, люди, инструмент и лавка
   перестают помещаться, и до прокачки лопаты приходится скроллить. Точка на
   вкладке = там появилось что-то по карману. */
var MTAB = [{k:"places", n:"МЕСТА"}, {k:"people", n:"ЛЮДИ"},
            {k:"tools", n:"ИНСТРУМЕНТ"}, {k:"shop", n:"ЛАВКА"}];
/* Вкладка лавки открывается после первой продажи: до неё игрок не видел
   ни одного покупателя, и покупки под них читались бы как лишние кнопки. */
function shopTabOn(){ return S.sold >= 1; }
function mapTab(){
 var t = S.mapTab || 0;
 if(t === 3 && !shopTabOn()) t = 0;
 return t;
}
function tabNew(i){
 var k = MTAB[i].k, r, L = loc();
 if(k === "places"){
  for(r = 0; r < LOC.length; r++){
   if(S.left[r] && r !== S.loc && Math.floor(S.bank[r]) >= 1) return true;
   if(!S.unlocked[r] && canTravel(r)) return true;
  }
  return false;
 }
 if(k === "people")
  return (!S.digger[S.loc] && S.coins >= L.digger) ||
         (!S.cleaner[S.loc] && S.coins >= L.cleaner) ||
         (!S.manager[S.loc] && S.coins >= L.mgr);
 if(k === "tools"){
  for(r = 0; r < UP.length; r++) if(upLv(UP[r].k) < UP[r].max && S.coins >= upCost(UP[r].k)) return true;
  return false;
 }
 for(r = 0; r < SHOP.length; r++) if(shopLv(SHOP[r].k) < SHOP[r].max && S.coins >= shopCost(SHOP[r].k)) return true;
 return false;
}
function setTab(i){
 S.mapTab = i;
 beep(392, .05, "square", .03);
 save(); paintMap();
}
function paintTabs(){
 var wrap = document.getElementById("mapTabs"), cur = mapTab();
 wrap.innerHTML = "";
 for(var i = 0; i < MTAB.length; i++)(function(i){
  if(i === 3 && !shopTabOn()) return;
  var b = document.createElement("button");
  b.type = "button";
  b.className = "mtab" + (i === cur ? " on" : "") + (tabNew(i) ? " new" : "");
  b.id = "mtab" + i;
  b.textContent = MTAB[i].n;
  b.onclick = function(){ setTab(i); };
  wrap.appendChild(b);
 })(i);
}

function pips(lv, max){
 var h = '<div class="pips">';
 for(var i = 0; i < max; i++) h += '<i class="pip' + (i < lv ? " on" : "") + '"></i>';
 return h + '</div>';
}
/* Одна и та же карточка покупки: имя с уровнем, описание, шкала уровней, цена. */
function upCard(list, name, lv, max, desc, cost, id, buy){
 var card = document.createElement("div"); card.className = "loc";
 var g = document.createElement("div"); g.className = "g";
 g.innerHTML = '<div class="ln">' + name + ' · ' + lv + '/' + max + '</div>' +
   '<div class="ls">' + desc + '</div>' + pips(lv, max);
 var btn = document.createElement("button");
 btn.className = "btn"; btn.type = "button"; btn.id = id;
 if(lv >= max){ btn.textContent = "МАКСИМУМ"; btn.disabled = true; }
 else{
  btn.textContent = fmt(cost);

  else btn.disabled = true;

function mapPlaces(list){
 for(var k = 0; k < LOC.length; k++)(function(k){
  var L = LOC[k], card = document.createElement("div");
  card.className = "loc" + (k === S.loc ? " here" : "");
  var g = document.createElement("div"); g.className = "g";
  var title = document.createElement("div"); title.className = "ln"; title.textContent = L.n;
  var sub = document.createElement("div"); sub.className = "ls";

  var btn = document.createElement("button"); btn.className = "btn"; btn.type = "button";

  if(!S.unlocked[k]){
   sub.textContent = "ЗАКРЫТО · НУЖНО " + fmt(L.open);
   var prog = document.createElement("div"); prog.className = "bar";
   var pi = document.createElement("i"); pi.style.width = Math.min(100, S.coins / L.open * 100) + "%";
   prog.appendChild(pi); g.appendChild(prog);
   var ready = S.digger[S.loc] && S.cleaner[S.loc] && S.coins >= L.open;
   btn.textContent = ready ? "ЕХАТЬ" : "ЗАКРЫТО";
   btn.disabled = !ready;
   if(ready) btn.id = "travelBtn";

/* Одна реплика на тип события превращала событие в кнопку без содержания.

var EV_LINE = {
 vein:["ЖИЛА", "МЯГКИЙ ПЛАСТ", "ПЕСОК ОСЫПАЛСЯ", "ПРОМОИНА ПОСЛЕ ДОЖДЯ", "ГРУНТ ПОДДАЛСЯ", "ТРЕЩИНА В ПОРОДЕ"],

};

 vein:["ГРУНТ МЯГКИЙ", "ПЛАСТ КРОШИТСЯ", "ЛОПАТА ИДЁТ КАК ПО МАСЛУ"],

 dump:["В ЯЩИК", "ПОДОБРАЛ", "ЦЕЛАЯ, ТОЛЬКО В ГРЯЗИ"]
};
function evPickLine(a){ return a[Math.floor(Math.random() * a.length)]; }
var EV_HINT = {vein:"ГРУНТ МЯГКИЙ", hype:"ЦЕНЫ ВЫШЕ"};

var ev = null, buff = null, evAt = Date.now() + EV_FIRST;

/* События открываются с первым копателем, цели — с первым чистильщиком.
   Считаем по всем локациям: переезд не должен отнимать уже открытое. */
function anyHired(a){ return !!(a[0] || a[1] || a[2]); }
/* События открываются с первым копателем, но в туторе ждут ещё минуту после того,
   как игрок назначил копателю лунку: иначе зелёная плашка выскакивает прямо поверх
   шага про назначение, и две подсказки лезут друг на друга. */
var EV_HOLD = 60000;
function evOn(){
 if(!anyHired(S.digger)) return false;
 if(S.tut < TUT.length && (!S.botAt || Date.now() - S.botAt < EV_HOLD)) return false;
 return true;
}
/* Цели раньше открывались вместе с чистильщиком, и первые двадцать минут игрок
   жил без единой цели. Теперь — сразу после первой продажи. */
function goalsOn(){ return S.sold >= 1 || anyHired(S.cleaner); }
function veinOn(){ return !!buff && buff.k === "vein"; }
function hypeOn(){ return !!buff && buff.k === "hype"; }
function evReset(){ evAt = Date.now() + EV_MIN + Math.random() * (EV_MAX - EV_MIN); }

function evPick(){
 var c = ["vein", "dump"];
 if(deals.length) c.push("hype");
 var f = freeShelf(), ok = 0;
 for(var i = 0; i < f.length; i++) if(f[i].q >= VIP.min) ok++;
 if(ok && deals.length < maxDeals()) c.push("vip");
 return c[Math.floor(Math.random() * c.length)];
}
function spawnEv(){
 var ek = evPick();
 ev = {k:ek, n:evPickLine(EV_LINE[ek]), ends:Date.now() + EV_CATCH};
 beep(660, .07, "square", .035);
 paintEv();
}
function vipDeal(){
 var f = freeShelf(), ok = [];
 for(var i = 0; i < f.length; i++) if(f[i].q >= VIP.min) ok.push(f[i]);
 if(!ok.length || deals.length >= maxDeals()) return false;
 var it = ok[Math.floor(Math.random() * ok.length)];
 var vp = priceParts(it, VIP);
 deals.push({b:VIP, u:it.u, sum:vp.sum, p:vp, min:false});
 return true;
}
function catchEv(){
 if(!ev) return;
 var k = ev.k, kn = ev.n || EV_NAME[k], kd = evPickLine(EV_DONE[k]);
 ev = null; evReset();
 S.seen.ev = 1;
 beep(784, .08, "square", .04);
 if(k === "vein"){
  buff = {k:"vein", t:kd, n:kn, ends:Date.now() + VEIN_MS};
  toast(kn + "\n" + kd + " 25 С");
 }else if(k === "hype"){
  /* Ажиотаж не пересчитывает уже висящие предложения: без таймера это
     превратило бы игру в «копи очередь и жди события». */
  buff = {k:"hype", t:kd, n:kn, ends:Date.now() + HYPE_MS};
  toast(kn + "\n" + kd + " 45 С · НОВЫМ ПОКУПАТЕЛЯМ");
 }else if(k === "vip"){
  if(vipDeal()) toast(kn + " У ПРИЛАВКА\nЖДЁТ ОТВЕТА");
  else{ S.coins += Math.round(50 * loc().mult); toast("ВИП НЕ ДОЖДАЛСЯ"); }
 }else{
  if(S.crate.length < CRATE_MAX){
   S.crate.push({loc:S.loc, i:pickIdx(), u:newUid()});
   toast(kn + "\n" + kd);
  }else{
   var bonus = Math.round(40 * loc().mult);
   S.coins += bonus;
   toast("ЯЩИК ПОЛОН\n+" + fmt(bonus));
  }
 }
 save();
 if(screen === "shop") paintShop();
 paintEv(); sync();
}

/* ---------- цели ---------- */

/* Цели открываются вместе с чистильщиком, поэтому в цепочке нет ничего, что к
   этому моменту уже сделано. Счётчики локации обнуляются в момент открытия
   (goalStart), иначе первые цели засчитываются заочно, за прошлые заслуги. */
var GOALS = [
 {t:"ПРОДАТЬ 3 НАХОДКИ",   f:function(k){ return S.soldLoc[k] >= 3; },  r:0.10},
 {t:"ОТКОПАТЬ 5 НАХОДОК",  f:function(k){ return S.digLoc[k] >= 5; },   r:0.15},
 {t:"ОЧИСТИТЬ НА 100%",    f:function(k){ return S.perfect[k] >= 1; },  r:0.20},
 {t:"ПРОДАТЬ 10 НАХОДОК",  f:function(k){ return S.soldLoc[k] >= 10; }, r:0.30},
 {t:"НАНЯТЬ МЕНЕДЖЕРА",    f:function(k){ return !!S.manager[k]; },     r:0.35},
 {t:"ПРОДАТЬ 25 НАХОДОК",  f:function(k){ return S.soldLoc[k] >= 25; }, r:0.50},
 /* Последняя цель не обрывается на числе продаж, а ведёт к переезду: иначе
    цепочка кончается там же, где у игрока кончаются причины копать. */
 {t:function(){ var n = nextLocIdx(); return n < 0 ? "СОБРАТЬ УНИКАЛЬНЫЕ" : "НАКОПИТЬ НА ПЕРЕЕЗД · " + LOC[n].n; },
  f:function(k){ var n = nextLocIdx(); return n < 0 ? albumTier(k, TIERS - 1) >= TIER_N : S.coins >= LOC[n].open; },
  r:0.80}
];
function goalText(i){ var t = GOALS[i].t; return typeof t === "function" ? t() : t; }
function goalStart(){
 var k = S.loc;
 if(S.goalOpen[k] || !goalsOn()) return;
 S.goalOpen[k] = 1;
 S.digLoc[k] = 0; S.soldLoc[k] = 0; S.perfect[k] = 0;

}

var digAcc = 0, clnAcc = 0, mgrAcc = 0, crewFlash = {d:0, c:0, m:0}, mgrTired = false;
setInterval(function(){
 var L = loc(), changed = S.digger[S.loc] || S.cleaner[S.loc] || S.manager[S.loc];
 evTick(); checkGoal(); paintGoal();

 if(S.digger[S.loc]){
  /* Наёмник копает только ту лунку, которую ему назначили, и встаёт, когда она
     кончилась: иначе автоматизация обходит выбор лунки стороной.
     Одно место в ящике он всегда оставляет игроку. */
  var bh = S.botHole >= 0 ? holes()[S.botHole] : null;
  if(S.pause.d || !bh || S.crate.length >= CRATE_MAX - keepFree(CRATE_MAX)) digAcc = 0;
  else{
   digAcc += 0.5;
   if(digAcc >= 12 * L.hard * layerMat(bh, bh.mats.length - 1).hp){
    digAcc = 0;
    S.crate.push({loc:S.loc, i:botIdx(), u:newUid()});
    S.digLoc[S.loc]++;
    bh.left--;
    S.adFinds = (S.adFinds || 0) + (bh.t === "ad" ? 0 : 1);
    crewFlash.d = Date.now();
    if(bh.left <= 0) collapseHole(S.botHole);
    holeSig = "";
    changed = true;
   }
  }
 }
 if(S.cleaner[S.loc]){
  if(S.pause.c || botCrateIdx() < 0 || S.store.length >= storeMax() - keepFree(storeMax())) clnAcc = 0;
  else{
   clnAcc += 0.5;
   if(clnAcc >= 10 * L.hard){
    clnAcc = 0;
    var bi = botCrateIdx();
    var raw = S.crate[bi];
    if(botSkips(raw)){
     /* Осмотр занимает тот же такт, что и чистка: вердикт приходит не мгновенно,
        а по мере того, как наёмник доходит до вещи в очереди. */
     raw.aside = 1;
     crewFlash.c = Date.now();
     toast("НАЁМНИК ОТЛОЖИЛ НАХОДКУ\nГОВОРИТ, НЕ ЕГО РАБОТА");
     beep(196, .08, "square", .03);
    }else{
     S.crate.splice(bi, 1);
     S.store.push({loc:raw.loc, i:raw.i, q:0.50 + Math.random() * 0.35, u:newUid(), h:0});
     crewFlash.c = Date.now();
     if(cItem && crateIdxOf(cItem.u) < 0){ cItem = null; clearClean(); ensureClean(); }
    }
    changed = true;
   }
  }
 }

 if(S.manager[S.loc] && !S.pause.m){
  var mnow = Date.now();
  if(mnow - S.mgrWin >= MGR_WIN){ S.mgrWin = mnow; S.mgrSold = 0; mgrTired = false; }
  mgrAcc += 0.5;
  if(mgrAcc >= 2){
   mgrAcc = 0;
   /* Менеджер выставляет только разрешённые ярусы: уникальную вещь
      он иначе продаст раньше, чем игрок решит оставить её в альбоме. */
   while(S.shelf.length < shelfMax()){
    var si = mgrStoreIdx();
    if(si < 0) break;
    S.shelf.push(S.store.splice(si, 1)[0]);
    crewFlash.m = Date.now();
   }
   /* Менеджер разгребает очередь по порядку прихода, а не снимает сливки:
      иначе игроку достаётся только то, что наёмник брать не захотел. */
   if(S.mgrSold < MGR_CAP){
    for(var q = 0; q < deals.length; q++){
     var dl = deals[q];
     if(S.mgrMode === 1 && dl.b.m < 1) continue;

  }
 }

 for(var r = 0; r < LOC.length; r++){
  if(S.left[r] && r !== S.loc){
   S.bank[r] = Math.min(bankCap(r), S.bank[r] + passiveOf(r) / 120);
   changed = true;
  }

 if(changed || S.tut < TUT.length){

 }

setInterval(function(){

 /* Сделка снимается только вместе с предметом: своего таймера у неё больше нет. */
 for(var i = deals.length - 1; i >= 0; i--){
  if(!shelfOf(deals[i].u)){ deals.splice(i, 1); gone++; }

 if(gone) sync();

/* Оффлайн активной локации начисляет не деньги, а работу бригады: игрок
   возвращается к полному ящику, то есть к работе руками, а не к сумме.
   Потолок в два часа при окне в четыре создаёт упущенную выгоду — заходить
   утром и вечером выгоднее, чем раз в сутки. */
var AWAY_WINDOW = 4 * 3600, AWAY_WORK = 2 * 3600;
function offline(){
 if(!S.t) return;
 var dt = Math.min(AWAY_WINDOW, (Date.now() - S.t) / 1000);
 if(dt < 60) return;
 var a = {bank:0, dug:0, cln:0, aside:0, sold:0, coins:0, hole:0, mins:Math.round(dt / 60)};

 for(var r = 0; r < LOC.length; r++){
  if(!S.left[r] || r === S.loc) continue;
  var add = Math.min(bankCap(r) - S.bank[r], passiveOf(r) / 60 * dt);
  if(add > 0){ S.bank[r] += add; a.bank += add; }
 }

 var work = Math.min(dt, AWAY_WORK), L = loc();

 /* Фазы идут вперемешку, а не по очереди: иначе копатель упирается в ящик
    и останавливается навсегда, хотя чистильщик тут же освободил бы место. */
 var nDig = 0, nCln = 0, nSell = 0, h = null;
 if(S.digger[S.loc] && !S.pause.d){
  h = S.botHole >= 0 ? holes()[S.botHole] : null;
  if(h) nDig = Math.floor(work / (12 * L.hard * layerMat(h, h.mats.length - 1).hp));
 }
 if(S.cleaner[S.loc] && !S.pause.c) nCln = Math.floor(work / (10 * L.hard));
 if(S.manager[S.loc] && !S.pause.m) nSell = Math.floor(work / 60) * MGR_CAP;

 var guard = 4000;
 while(guard-- > 0){
  var did = false;

  if(nDig > 0 && h && h.left > 0 && S.crate.length < CRATE_MAX - keepFree(CRATE_MAX)){
   S.crate.push({loc:S.loc, i:botIdx(), u:newUid()});
   S.digLoc[S.loc]++; a.dug++; nDig--; did = true;
   h.left--;
   S.adFinds = (S.adFinds || 0) + (h.t === "ad" ? 0 : 1);
   /* Счётчик лунки уменьшается и за оффлайн: иначе лунки стали бы бесконечными. */
   if(h.left <= 0){ collapseHole(S.botHole); a.hole = 1; h = null; }
  }

  if(nCln > 0 && S.store.length < storeMax() - keepFree(storeMax())){
   var bi = botCrateIdx();
   if(bi >= 0){
    var raw = S.crate[bi];
    nCln--; did = true;
    if(botSkips(raw)){ raw.aside = 1; a.aside++; }
    else{
     S.crate.splice(bi, 1);
     S.store.push({loc:raw.loc, i:raw.i, q:0.50 + Math.random() * 0.35, u:newUid(), h:0});
     a.cln++;
    }
   }
  }

  if(nSell > 0){
   while(S.shelf.length < shelfMax()){
    var si = mgrStoreIdx();
    if(si < 0) break;
    S.shelf.push(S.store.splice(si, 1)[0]);
   }
   var sidx = -1;
   for(var q = 0; q < S.shelf.length; q++) if(S.mgrTier[tierOf(S.shelf[q].i)]){ sidx = q; break; }
   if(sidx >= 0){
    /* Менеджер торгует по нижней планке: без наценки за идеал и без разброса
       вверх. Полная цена за сон обесценила бы прилавок. */
    var sit = S.shelf[sidx], art = ART[sit.loc][sit.i];
    var paid = Math.max(1, Math.round(art.v * LOC[sit.loc].mult * qualMult(sit.q) * 0.7));
    S.coins += paid; S.sold++; S.soldLoc[S.loc]++;
    a.sold++; a.coins += paid; nSell--; did = true;
    S.shelf.splice(sidx, 1);
   }else nSell = 0;
  }

  if(!did) break;
 }

 if(a.bank < 1 && !a.dug && !a.cln && !a.sold && !a.aside) return;
 save();
 setTimeout(function(){ showAway(a); }, 400);
}
function awayRow(k, v){ return '<div class="awRow"><span>' + k + '</span><b>' + v + '</b></div>'; }
function showAway(a){
 var h = awayRow("ТЕБЯ НЕ БЫЛО", a.mins < 60 ? a.mins + " МИН" : Math.round(a.mins / 60) + " Ч");
 if(a.dug) h += awayRow("ВЫКОПАНО", a.dug);
 if(a.cln) h += awayRow("ОЧИЩЕНО", a.cln);
 if(a.aside) h += awayRow("ОТЛОЖЕНО ТЕБЕ", a.aside);
 if(a.sold) h += awayRow("ПРОДАНО", a.sold + " · +" + fmt(a.coins));
 if(a.bank >= 1) h += awayRow("СТАРЫЕ ЛАВКИ", "+" + fmt(Math.round(a.bank)) + " НА КАРТЕ");
 if(a.hole) h += awayRow("ЛУНКА", "КОНЧИЛАСЬ");
 if(!a.dug && !a.cln && !a.sold) h += awayRow("БРИГАДА", "НЕКОМУ РАБОТАТЬ");
 document.getElementById("awList").innerHTML = h;
 document.getElementById("away").classList.add("on");
 beep(440, .07, "square", .03);
}

function liftBubble(bub, app){

  bub.style.bottom = need + "px";
 }else if(parseFloat(bub.style.bottom) < need) bub.style.bottom = need + "px";
}

 el.style.width = w + "px"; el.style.height = h + "px";
}
function unlift(){ for(var i = 0; i < lifted.length; i++) lifted[i].classList.remove("cup"); lifted = []; }
function coachHide(){
 coach.classList.remove("on"); coach.classList.remove("hard");
 document.getElementById("cring").style.display = "none";
 document.getElementById("chand").style.display = "none";
 document.getElementById("cbub").classList.remove("on");
 unlift(); curTut = -1;
}
/* Цель шага живёт на своём экране. Если игрок на другом, подсказка не исчезает,
   а переезжает на кнопку нужной вкладки — иначе шаг видно только там, где он и так очевиден. */
/* Цель шага может лежать на вкладке карты, которая сейчас закрыта: тогда
   вкладку переключаем сами, иначе кольцо рисуется в пустоту. */
var TGT_TAB = {hireDig:1, hireCln:1, hireMgr:1, mgrMode:1, travelBtn:0,
 up_dig:2, up_brush:2, up_hand:2,
 shop_sign:3, shop_case:3, shop_store:3, shop_ads:3, shop_eye:3};
var TGT_SCREEN = {digPit:"dig", digCta:"dig", holeBtn:"dig", holePick:"dig",
 clnPit:"clean", clnCta:"clean",
 slots:"shop", store:"shop", deals:"shop",
 hireDig:"map", hireCln:"map", hireMgr:"map", mgrMode:"map", travelBtn:"map", up_dig:"map"};
var NAV_NAME = {dig:"РАСКОП", clean:"ЧИСТКА", shop:"ЛАВКА", map:"КАРТА"};

/* Как только игрок начал копать или чистить, реплика уходит: на этих шагах она
   стоит поверх поля, и работать под ней невозможно. Возвращается со сменой шага. */
var tutMute = false;
function muteBubble(){
 if(tutMute || S.tut >= TUT.length) return;
 var s0 = TUT[S.tut];
 if(!s0 || (s0.tgt !== "digPit" && s0.tgt !== "clnPit")) return;
 tutMute = true;
 document.getElementById("cbub").classList.remove("on");
 document.getElementById("chand").style.display = "none";
}
/* Реплика не должна закрывать кнопку действия: на раскопе и чистке она всегда
   поднимается выше CTA, даже если подсказка указывает на всю яму целиком. */
function bubFloor(app){
 var id = screen === "dig" ? "digCta" : (screen === "clean" ? "clnCta" : "");
 var base = 96;
 if(!id) return base;
 var el = document.getElementById(id);
 if(!el || !el.getClientRects().length) return base;
 return Math.max(base, app.clientHeight - rectIn(el).y + 8);
}
function drawCoach(s, idx){
 /* Шаг без цели: просто реплика. Кольцо на случайной кнопке обещает,
    что по ней надо нажать, а нажатие ничего не делает. */
 if(!s.tgt){
  if(curTut === idx) return;
  curTut = idx; lastDraw = Date.now(); tutShown = Date.now(); tutMute = false;
  unlift();
  coach.classList.add("on");
  coach.classList.remove("hard");
  document.getElementById("cring").style.display = "none";
  document.getElementById("chand").style.display = "none";
  var b0 = document.getElementById("cbub");
  b0.style.top = "auto";
  b0.style.bottom = bubFloor(document.getElementById("app")) + "px";
  b0.classList.add("on");
  liftBubble(b0, document.getElementById("app"));
  document.getElementById("ctxt").textContent = s.t;
  document.getElementById("chint").textContent = s.h || "";
  clearTimeout(fadeTimer);
  return;
 }
 /* Цель бывает подвижной: одна и та же реплика ведёт то к кнопке ЛУНКИ,
    то к карточке лунки — смотря что сейчас на экране. Поэтому tgt может быть
    функцией, а не строкой. */
 var tg = typeof s.tgt === "function" ? s.tgt() : s.tgt;
 var el = document.getElementById(tg), away = "";
 if(!el || !el.getClientRects().length){
  var sc = TGT_SCREEN[tg];
  /* Цель может сидеть на закрытой вкладке карты: открываем вкладку сами,
     иначе шаг ведёт в пустоту и выглядит сломанным. */
  if(sc === "map" && screen === "map" && TGT_TAB[tg] !== undefined && mapTab() !== TGT_TAB[tg]){
   S.mapTab = TGT_TAB[tg];
   paintMap();
   el = document.getElementById(tg);
  }
  if(!el || !el.getClientRects().length){
   var nav = sc && sc !== screen ? document.getElementById(NAV[sc]) : null;
   if(!nav || !nav.getClientRects().length){ coachHide(); return; }
   el = nav; away = sc;
  }
 }
 var key = idx + "|" + tg + (away ? "|" + away : "");
 if(curTut === key && Date.now() - lastDraw < 400) return;
 /* Цель может лежать ниже сгиба в прокручиваемом списке: без этого кольцо
    рисуется за экраном, и шаг выглядит сломанным. */
 if(curTut !== key && el.scrollIntoView){
  var rv = el.getBoundingClientRect();
  if(rv.top < 0 || rv.bottom > (window.innerHeight || 0)) el.scrollIntoView({block:"center"});
 }
 lastDraw = Date.now();
 var app = document.getElementById("app");
 var r = rectIn(el), pad = 6;
 var x = Math.max(0, r.x - pad), y = Math.max(0, r.y - pad), w = r.w + pad * 2, h = r.h + pad * 2;
 var AH = app.clientHeight;

 coach.classList.add("on");
 coach.classList.toggle("hard", !!s.hard);
 unlift();
 if(s.hard){
  var ids = [away ? el.id : tg].concat(s.allow || []);
  for(var i = 0; i < ids.length; i++){
   var e2 = document.getElementById(ids[i]);
   if(e2){ e2.classList.add("cup"); lifted.push(e2); }
  }
 }
 var ring = document.getElementById("cring");
 ring.style.display = "block"; box(ring, x, y, w, h);

 var hand = document.getElementById("chand");
 if(s.hand){
  hand.style.display = "block";
  hand.style.left = (x + w * 0.28) + "px";
  hand.style.top = (y + h * 0.32) + "px";
 }else hand.style.display = "none";

 var uTop = y, uBot = y + h;
 for(var q = 0; q < lifted.length; q++){
  var ar = rectIn(lifted[q]);
  uTop = Math.min(uTop, ar.y - pad); uBot = Math.max(uBot, ar.y + ar.h + pad);
 }
 var bub = document.getElementById("cbub");
 var faded = s.fade && curTut === key && Date.now() - tutShown > FADE_MS;
 bub.classList.toggle("on", !faded && !tutMute);
 var BH = 160, floor = bubFloor(app), safeBot = AH - floor;
 /* Ниже safeBot лежит кнопка действия: реплику туда опускать нельзя. */
 if(uBot + BH < safeBot){ bub.style.top = (uBot + 10) + "px"; bub.style.bottom = "auto"; }
 else if(uTop > BH){ bub.style.bottom = Math.max(floor, AH - uTop + 10) + "px"; bub.style.top = "auto"; }
 else{ bub.style.bottom = Math.max(floor, AH - (y + h) + 10) + "px"; bub.style.top = "auto"; }
 liftBubble(bub, app);
 if(curTut !== key){
  curTut = key;
  tutMute = false;
  bub.classList.toggle("on", !faded);
  tutShown = Date.now();
  document.getElementById("ctxt").textContent = s.t;
  document.getElementById("chint").textContent = away ? "Вкладка " + NAV_NAME[away] : (s.h || "");
  clearTimeout(fadeTimer);
  if(s.fade) fadeTimer = setTimeout(tut, FADE_MS + 60);
 }
}
function tut(){
 if(S.tut >= TUT.length){ coachHide(); return; }
 var s = TUT[S.tut];
 /* Условие проверяем раньше wait: шаг про сделку выполняется в тот же миг,
    когда покупатель исчезает с прилавка, и на wait тутор застревал навсегда. */
 if(s.c()){ S.tut++; save(); tut(); return; }
 if(s.wait && !s.wait()){ coachHide(); return; }
 syncHoleBtn();
 drawCoach(s, S.tut);
}
document.getElementById("cbub").onclick = function(){
 var s = TUT[S.tut];
 if(!s || (s.hard && !s.ack)) return;
 /* Шаг про альбом ставит свой флаг: открытие вкладки не должно зависеть
    от того, на каком номере шага стоит счётчик. */
 if(s.mark === "album" && !S.seen.album){
  S.seen.album = 1;
  toast("ОТКРЫТ АЛЬБОМ\nВКЛАДКА ВНИЗУ СПРАВА");
 }
 S.tut++; save(); tut();
 sync();   /* иначе нижняя панель обновится только со следующим тиком */
};

/* ---------- размеры и синхронизация ---------- */

function sizeCanvas(pit, cvs, setter){
 var r = pit.getBoundingClientRect();
 var dpr = Math.min(2, window.devicePixelRatio || 1);
 var w = Math.max(120, Math.round(r.width)), h = Math.max(120, Math.round(r.height));
 cvs.forEach(function(c){
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
 });
 setter(w, h);
}
var dDims = "", cDims = "";
function dimsOf(el){
 var r = el.getBoundingClientRect();
 return Math.round(r.width) + "x" + Math.round(r.height);
}
function resizeAll(force){
 var k1 = dimsOf(dPit);
 if(k1 !== "0x0" && (force || k1 !== dDims)){
  dDims = k1;
  sizeCanvas(dPit, [dcU, dcD, dcF], function(w, h){
   dW = w; dH = h; dCell = Math.max(10, Math.floor(w / 12));
   dCols = Math.ceil(w / dCell); dRows = Math.ceil(h / dCell);
  });
  if(dSite) layoutDig();
 }
 var k2 = dimsOf(cPit);
 if(k2 !== "0x0" && (force || k2 !== cDims)){
  cDims = k2;
  sizeCanvas(cPit, [ccU, ccC, ccF], function(w, h){
   cW = w; cH = h; cCell = Math.max(10, Math.floor(w / 12));
   cCols = Math.ceil(w / cCell); cRows = Math.ceil(h / cCell);
  });
  if(cItem) layoutClean(); else clearClean();
 }
}

function paintCrew(){
 var L = loc(), now = Date.now();
 var hasD = !!S.digger[S.loc], hasC = !!S.cleaner[S.loc], hasM = !!S.manager[S.loc];
 var any = hasD || hasC || hasM;
 var btn = document.getElementById("crewBtn");
 btn.classList.toggle("on", any);
 btn.classList.toggle("alert", any && (now - crewFlash.d < 900 || now - crewFlash.c < 900 || now - crewFlash.m < 900));
 if(!any) crewOpen = false;

 var panel = document.getElementById("crewPanel");
 panel.classList.toggle("on", crewOpen);
 if(!crewOpen) return;

 var fd = now - crewFlash.d < 900, fc = now - crewFlash.c < 900, fm = now - crewFlash.m < 900;
 var dTxt = fd ? "+1 В ЯЩИК" : (S.pause.d ? "НА ПАУЗЕ" :
   (S.botHole < 0 || !holes()[S.botHole] ? "ЛУНКА НЕ НАЗНАЧЕНА" :
