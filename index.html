   (botCrateIdx() >= 0 ? "ЧИСТИТ" : (S.crate.length ? "ЦЕННОЕ ОТЛОЖЕНО ТЕБЕ" : "ЖДЁТ НАХОДКУ"))));
 var mLeft = Math.max(0, MGR_CAP - S.mgrSold);
 var mTxt = fm ? "ПРОДАЛ" : (S.pause.m ? "НА ПАУЗЕ" :
   (mLeft <= 0 ? "ЛИМИТ · ДАЛЬШЕ САМ" :
   (mgrStoreIdx() >= 0 || S.shelf.length ? "ЕЩЁ " + mLeft + " СДЕЛОК ЗА МИНУТУ" : "НЕЧЕГО ВЫСТАВИТЬ")));

 /* Панель перестраиваем только когда меняется её состав: иначе кнопки
    пересоздаются под пальцем и тап не доходит. */
 var sig = [hasD, hasC, hasM, S.pause.d, S.pause.c, S.pause.m,
            S.clnAll, S.mgrTier.join("")].join("|");
 if(sig !== crewSig){
  crewSig = sig;
  var html = "";
  if(hasD) html += crewLine("КОПАТЕЛЬ", "d", dTxt) + crewBtns("КОПАТЕЛЬ", "d", null);
  if(hasC) html += crewLine("ЧИСТИЛЬЩИК", "c", cTxt) + crewBtns("ЧИСТИЛЬЩИК", "c", null);
  if(hasM) html += crewLine("МЕНЕДЖЕР", "m", mTxt) + crewBtns("МЕНЕДЖЕР", "m", S.mgrTier);
  panel.innerHTML = html;
  bindCrew();
 }
 setCrew("d", dTxt, Math.min(1, digAcc / (12 * L.hard)), fd);
 setCrew("c", cTxt, Math.min(1, clnAcc / (10 * L.hard)), fc);
 setCrew("m", mTxt, null, fm);
 return;
 if(hasM){
  var mb = document.createElement("button");
  mb.className = "btn can"; mb.type = "button";
  mb.textContent = S.mgrMode ? "ЖДЁТ ЛУЧШИХ" : "ПРОДАЁТ СРАЗУ";
  mb.onclick = function(){
   S.mgrMode = S.mgrMode ? 0 : 1;
   beep(440, .06, "square", .03);
   save(); sync(); if(screen === "map") paintMap();
  };
  panel.appendChild(mb);
 }
}
document.getElementById("crewBtn").onclick = function(e){
 e.stopPropagation();
 crewOpen = !crewOpen;
 beep(330, .05, "square", .025);
 sync();
};
document.addEventListener("pointerdown", function(e){
 if(!crewOpen) return;
 var p = document.getElementById("crewPanel"), b = document.getElementById("crewBtn");
 if(p.contains(e.target) || b.contains(e.target)) return;
 crewOpen = false; sync();
}, true);

/* Пока идёт тутор, выбор лунки не показываем: коуч указывает на яму, и список
   карточек в этот момент только сбивает. Берём первую доступную. */
/* Лунку за игрока выбирает только тутор, и только до шага про выбор лунки.
   Дальше пустой слот означает «иди в меню лунок», а не «на тебе следующую». */
function ensureHole(){
 if(S.hole >= 0 && curHole()){ if(!dSite) newSite(); return; }
 if(pickOpen || S.tut >= HOLE_STEP) return;
 var l = holes(), lv = upLv("dig");
 for(var i = 0; i < 3; i++) if(l[i] && l[i].req <= lv){ S.hole = i; newSite(); return; }
}
/* Видимость кнопки ЛУНКИ считается отдельно: sync() обновляет её раньше, чем tut()
   успевает перевести шаг, и коуч не находил ещё скрытую кнопку. Теперь tut() зовёт
   эту же функцию прямо перед отрисовкой подсказки. */
function syncHoleBtn(){
 var picking = pickOpen || !curHole() || !dSite;
 document.getElementById("holeBtn").style.display = (picking || S.tut < HOLE_STEP) ? "none" : "";
}
function hNowMeta(){
 var h = curHole();
 return h ? h.n + " · " + layerMat(h, dLayer).n : loc().n + " · ВЫБОР ЛУНКИ";
}
function sync(){
 tutDealCheck();
 document.getElementById("coins").textContent = fmt(S.coins);
 var pas = 0;
 for(var r = 0; r < LOC.length; r++) if(S.left[r] && r !== S.loc) pas += passiveOf(r);
 document.getElementById("rate").textContent = pas > 0 ? "+" + fmt(pas) + "/МИН" : "";

 var L = loc();
 var metaL = document.getElementById("metaL"), metaR = document.getElementById("metaR");
 if(screen === "dig"){
  metaL.textContent = hNowMeta();
  metaR.textContent = "ЯЩИК " + S.crate.length + "/" + CRATE_MAX;
 }else if(screen === "clean"){
  metaL.textContent = cItem ? (cLit ? cItem.art.n : "НАХОДКА В КОРКЕ") : "ЯЩИК ПУСТ";
  metaR.textContent = cItem ? "КАЧЕСТВО " + Math.round(cQual * 100) + "%" : "";
  metaR.style.color = cItem ? qualColor(cQual) : "var(--ink-dim)";
 }else if(screen === "shop"){
  metaL.textContent = "ЛАВКА · " + L.n;
  metaR.textContent = "ВИТРИНА " + S.shelf.length + "/" + shelfMax();
 }else if(screen === "album"){
  metaL.textContent = "АЛЬБОМ · " + L.n;
  metaR.textContent = "СОБРАНО " + albumCount(S.loc) + "/" + ART[S.loc].length;
 }else{
  metaL.textContent = "ЭКСПЕДИЦИИ";
  metaR.textContent = "ПРОДАНО " + S.sold;
 }
 if(screen !== "clean") metaR.style.color = "var(--hud)";

 if(S.tut < HOLE_STEP && (!curHole() || !dSite)) ensureHole();
 var picking = pickOpen || !curHole() || !dSite;
 document.getElementById("scDig").classList.toggle("pick", picking);
 if(screen === "dig" && picking) paintHoles();

 var dp = Math.min(1, dReady ? 1 : dDone / dTotal);
 document.getElementById("digBar").style.width = (dp * 100) + "%";
 document.getElementById("digPct").textContent = Math.round(dp * 100) + "%";
 var hNow = curHole();
 syncHoleBtn();
 document.getElementById("digName").textContent = S.crate.length >= CRATE_MAX ? "ЯЩИК ПОЛОН" :
  (hNow ? "СЛОЙ " + Math.min(dLayer + 1, hNow.mats.length) + " ИЗ " + hNow.mats.length + " · " + dMat.n : "УЧАСТОК");
 document.getElementById("digTag").textContent = S.crate.length >= CRATE_MAX ?
  "ЯЩИК ПОЛОН — ИДИ НА ЧИСТКУ" : (dTouched ? "КОПАЕМ" : "УЧАСТОК НЕ ТРОНУТ");
 var dcta = document.getElementById("digCta");
 if(S.crate.length >= CRATE_MAX){ dcta.disabled = true; dcta.textContent = "ЯЩИК ПОЛОН"; dcta.classList.remove("can"); }
 else if(dReady){ dcta.disabled = false; dcta.textContent = "ЗАБРАТЬ В ЯЩИК"; dcta.classList.add("can"); }
 else{ dcta.disabled = true; dcta.textContent = "СЛОЙ " + Math.round(dp * 100) + "%"; dcta.classList.remove("can"); }

 var cp = cItem ? Math.min(1, cDone / cTotal) : 0;
 document.getElementById("clnBar").style.width = (cp * 100) + "%";
 document.getElementById("clnPct").textContent = Math.round(cp * 100) + "%";
 document.getElementById("clnName").textContent = cItem ? "КОРКА" : "НЕЧЕГО ЧИСТИТЬ";
 document.getElementById("clnHold").classList.toggle("on", screen === "clean" && !!S.cleaner[S.loc] && !!S.pause.c);
 /* Плашка про хрупкость стоит внизу ямы и закрывает собой последние клетки корки.
    Своё дело она делает в начале чистки, поэтому после половины пути убирается. */
 document.getElementById("clnWarn").classList.toggle("on",
  screen === "clean" && !!cItem && cTotal > 0 && cDone / cTotal < 0.5);
 document.getElementById("digHold").classList.toggle("on", screen === "dig" && !!S.digger[S.loc] && !!S.pause.d);
 if(screen === "clean") paintCrate();
 var ccta = document.getElementById("clnCta");
 if(!cItem){ ccta.disabled = true; ccta.textContent = "ЯЩИК ПУСТ"; ccta.classList.remove("can"); }
 else if(S.store.length >= storeMax()){ ccta.disabled = true; ccta.textContent = "СКЛАД ПОЛОН"; ccta.classList.remove("can"); }
 else if(cp >= 1){ ccta.disabled = false; ccta.textContent = "НА СКЛАД"; ccta.classList.add("can"); }
 else{ ccta.disabled = true; ccta.textContent = "КОРКА " + Math.round(cp * 100) + "%"; ccta.classList.remove("can"); }

 document.getElementById("navClean").textContent = "ЧИСТКА" + (S.crate.length ? " " + S.crate.length : "");
 var ns = document.getElementById("navShop");
 ns.textContent = "ЛАВКА" + (deals.length ? " • " + deals.length : (S.shelf.length ? " " + S.shelf.length : ""));
 ns.classList.toggle("alert", deals.length > 0 && screen !== "shop");

 /* Вкладка альбома появляется вместе с первым экспонатом и мигает, пока в неё не зашли. */
 document.getElementById("nav").classList.toggle("five", albumOn());
 document.getElementById("navAlbum").classList.toggle("alert", albumOn() && !S.seen.albumOpen);

 paintCrew();

 tut();
 paintGoal();
}

/* ЧИТ ДЛЯ ТЕСТА: тап по монетам даёт +1000. Убрать перед продом. */
document.getElementById("coinBox").onclick = function(){
 S.coins += 1000;
 beep(880, .05, "square", .03);
 toast("ЧИТ +1000");
 save(); sync();
 if(screen === "map") paintMap();
 if(screen === "shop") paintShop();
};

document.getElementById("sound").onclick = function(){
 S.sound = !S.sound;
 document.getElementById("wave").style.opacity = S.sound ? "1" : "0.15";
 if(S.sound) beep(520, .06, "square", .03);
 save();
};

/* Просмотрщик артефактов в мобильном приложении отдаёт фрейму высоту почти во весь
   экран, но нижнюю часть накрывает своя шапка: кнопка действия и навигация уезжают
   под обрез. Измерить это изнутри нельзя — visualViewport возвращает ту же завышенную
   высоту. Отличаем случай по косвенному признаку: мы во фрейме и фрейм занимает почти
   весь экран устройства. В обычном браузере фрейм заметно ниже экрана (адресная строка,
   шапка страницы), там запас не берём и игра занимает всё место. */
var CLIP_PAD = 96;
function clipPad(h){
 if(!document.documentElement.classList.contains("embed")) return 0;
 var sh = (window.screen && window.screen.height) || 0;
 if(!sh) return 0;
 return h >= sh * 0.9 ? CLIP_PAD : 0;
}
function fit(){
 var vv = window.visualViewport;
 var h = (vv && vv.height) || window.innerHeight || document.documentElement.clientHeight;
 if(!h) return;
 h = Math.round(h) - clipPad(h);
 if(h < 360) h = 360;
 document.body.style.height = h + "px";
 document.getElementById("app").style.height = h + "px";
}
function refit(){ fit(); resizeAll(); sync(); }
window.addEventListener("resize", refit);
window.addEventListener("orientationchange", function(){ setTimeout(refit, 150); });
if(window.visualViewport){
 window.visualViewport.addEventListener("resize", refit);
 window.visualViewport.addEventListener("scroll", fit);
}
fit();
if(window.ResizeObserver) new ResizeObserver(function(){ resizeAll(); sync(); }).observe(document.getElementById("app"));
setTimeout(refit, 60); setTimeout(refit, 400);

if(S.loc > 0 && S.tut < TUT.length) S.tut = TUT.length;
if(S.tut >= ALBUM_END) S.seen.album = 1;
initHoles();
resizeAll();
ensureHole();
ensureClean();
offline();
document.getElementById("wave").style.opacity = S.sound ? "1" : "0.15";
setInterval(save, 5000);
show("dig");
})();
</script>
